const majorSymbol={M00:"절벽 끝의 여행자, 흰 장미, 작은 개, 높은 산은 순수한 가능성과 위험을 함께 보여준다.",M01:"한 손은 하늘, 한 손은 땅을 가리키고 탁자에는 네 수트의 도구가 놓여 있다. 생각을 현실로 옮길 자원이 이미 있다는 그림이다.",M02:"흑백 기둥 사이의 여사제와 장막, 달은 겉으로 드러나지 않은 지식과 직관을 뜻한다.",M03:"곡식과 숲, 금성 문양, 풍성한 옷은 생명력·감각·돌봄·창조가 자라는 장면이다.",M04:"돌 왕좌와 산, 갑옷은 감정보다 구조와 경계, 책임을 먼저 세우는 힘을 보여준다.",M05:"두 제자와 열쇠, 의식적 손짓은 전통·교육·제도 안에서 지식을 전수하는 장면이다.",M06:"두 인물과 천사, 나무와 산은 끌림만이 아니라 서로 다른 가치 앞에서의 선택과 결합을 보여준다.",M07:"전차와 서로 다른 두 스핑크스는 반대 방향의 힘을 의지로 한 방향에 묶어 전진시키는 모습이다.",M08:"여인이 사자를 억누르지 않고 부드럽게 다루는 장면은 힘을 폭력이 아니라 인내와 자기조절로 읽게 한다.",M09:"산꼭대기의 은둔자와 등불은 외부의 소음에서 떨어져 자기 기준과 지혜를 찾는 모습이다.",M10:"회전하는 바퀴와 여러 상징은 통제할 수 없는 순환, 변화하는 위치와 타이밍을 보여준다.",M11:"검과 저울은 감정적 편들기보다 사실·균형·책임에 따라 결론을 내리는 원리를 상징한다.",M12:"거꾸로 매달렸지만 표정이 평온한 인물과 빛나는 머리는 멈춤을 통해 관점이 바뀌는 순간을 보여준다.",M13:"해골 기수와 쓰러진 인물, 떠오르는 태양은 한 단계의 끝이 다음 단계의 시작을 만든다는 장면이다.",M14:"천사가 두 컵 사이로 물을 옮기며 한 발은 물, 한 발은 땅에 둔다. 서로 다른 것을 조절해 새 균형을 만드는 카드다.",M15:"사슬에 묶인 두 인물과 악마는 욕망·습관·집착에 스스로 묶인 상태와 그 사슬을 인식하는 문제를 보여준다.",M16:"번개 맞은 탑에서 사람들이 떨어지는 장면은 잘못 세운 구조가 갑자기 무너져 진실이 드러나는 순간이다.",M17:"별빛 아래 물을 붓는 인물은 큰 충격 뒤에 다시 흐르기 시작하는 희망·회복·솔직함을 보여준다.",M18:"달, 두 탑, 개와 늑대, 물에서 올라오는 가재는 익숙함과 본능 사이의 불확실한 길과 무의식을 상징한다.",M19:"큰 태양과 아이, 해바라기는 숨김없는 명료함·생명력·기쁨이 밖으로 드러나는 장면이다.",M20:"천사의 나팔에 사람들이 관에서 일어나는 장면은 과거를 돌아보고 부름에 응답해 새 단계로 깨어나는 순간이다.",M21:"월계환 속 인물과 네 존재는 긴 여정의 요소들이 하나로 통합되어 한 주기가 완성되는 모습을 보여준다."};
const suitSymbol={Wands:"완드는 불의 수트다. 그림에서 막대기·움직임·몸의 방향을 보고 열정, 행동, 창조력의 상태를 읽는다.",Cups:"컵은 물의 수트다. 컵의 배치와 인물의 표정을 보고 감정, 관계, 수용과 교류의 상태를 읽는다.",Swords:"소드는 공기의 수트다. 검의 방향, 하늘과 인물의 긴장을 보고 생각, 말, 판단, 갈등의 상태를 읽는다.",Pentacles:"펜타클은 땅의 수트다. 동전, 작업, 건물과 몸의 자세를 보고 돈, 일, 건강, 생활 기반을 읽는다."};
const rankLesson={1:"에이스는 수트의 에너지가 씨앗처럼 막 시작되는 단계다.",2:"2는 둘 사이의 균형·선택·대립을 본다.",3:"3은 시작된 힘이 관계나 결과로 확장되는 단계다.",4:"4는 구조·안정·고정이 생기는 단계다.",5:"5는 안정이 흔들리며 갈등·결핍·변화를 겪는 단계다.",6:"6은 5의 흔들림 뒤 조정·회복·진전이 나타나는 단계다.",7:"7은 시험, 평가, 전략처럼 한 번 더 점검하는 단계다.",8:"8은 힘이 구체적으로 움직이거나 반복·숙련되는 단계다.",9:"9는 완성 직전의 성숙과 부담을 함께 본다.",10:"10은 한 사이클이 꽉 차 결과·완성과 다음 단계의 부담을 보여준다.",11:"시종은 배우고 관찰하며 소식을 가져오는 초보자의 에너지다.",12:"기사는 수트의 힘을 행동으로 밀어붙이는 방식이다.",13:"여왕은 수트의 힘을 내면에서 성숙하게 다루는 방식이다.",14:"왕은 수트의 힘을 외부 세계에서 책임 있게 운영하는 방식이다."};
const majorMeaning={M00:"익숙한 안전지대를 벗어나 새 경험을 시작한다. 아직 모든 답이 없어도 가능성을 믿고 첫발을 내딛는 힘이다.",M01:"아이디어를 실행할 도구와 능력이 손에 있다. 의도를 분명히 하고 가진 자원을 연결해 현실적인 행동으로 옮긴다.",M02:"겉으로 보이는 정보보다 직감과 아직 말해지지 않은 부분을 읽는다. 성급히 결론내리기보다 관찰하고 기다린다.",M03:"무언가를 키우고 돌보며 풍요롭게 만드는 힘이다. 창작, 관계, 몸과 생활을 실제로 보살피는 쪽으로 읽는다.",M04:"경계와 규칙을 세우고 책임 있게 통제한다. 감정보다 구조를 먼저 잡아 안정적인 기반을 만드는 카드다.",M05:"검증된 방식, 스승, 조직, 전통에서 배운다. 혼자만의 방식보다 공통의 규칙과 지식을 참고할 때다.",M06:"중요한 관계 또는 가치의 선택이다. 무엇을 좋아하느냐보다 어떤 가치와 약속을 선택할 것인지가 핵심이다.",M07:"서로 다른 욕구를 한 방향으로 묶어 밀고 나간다. 목표가 분명할수록 추진력이 강해진다.",M08:"강한 감정이나 본능을 억압하지 않고 부드럽게 다룬다. 인내, 용기, 자기조절이 실제 힘이 된다.",M09:"밖의 답보다 안의 기준을 찾는 시간이다. 혼자 생각하고 조사하며 불필요한 소음을 줄일수록 답이 선명해진다.",M10:"상황의 국면이 바뀐다. 모든 것을 통제하기보다 돌아오는 기회와 타이밍을 읽고 변화에 맞춰 움직인다.",M11:"행동의 결과를 객관적으로 마주한다. 사실, 계약, 기준, 책임을 따져 공정한 결론을 내리는 카드다.",M12:"억지로 진행하기보다 멈추고 보는 방향을 바꾼다. 내려놓음이나 기다림이 손해가 아니라 새로운 이해를 만든다.",M13:"끝내야 할 것을 끝내야 다음 단계가 열린다. 실제 죽음보다 관계·상태·습관·국면의 강한 종료와 변화를 뜻한다.",M14:"극단으로 가지 않고 서로 다른 요소를 섞어 적정점을 찾는다. 천천히 조절하고 회복하며 지속 가능한 균형을 만든다.",M15:"욕망, 집착, 의존, 두려움이 선택을 묶고 있는지 본다. 사슬을 알아차리는 순간 선택권도 다시 보이기 시작한다.",M16:"버티던 구조가 갑자기 깨지며 숨겨진 문제가 드러난다. 충격은 크지만 거짓 기반을 걷어내고 다시 세울 기회이기도 하다.",M17:"상처 뒤에 희망과 신뢰가 돌아온다. 과장된 낙관보다 솔직함, 회복, 장기적인 방향을 믿는 카드다.",M18:"정보가 흐리고 감정과 상상이 사실처럼 느껴질 수 있다. 직감을 무시하지 않되 확인되지 않은 공포를 사실로 단정하지 않는다.",M19:"상황이 밝아지고 에너지와 자신감이 드러난다. 숨길 것이 적고 결과를 즐기며 솔직하게 표현하기 좋은 카드다.",M20:"과거의 경험을 다시 평가하고 중요한 부름이나 결정을 받아들인다. 같은 패턴을 반복할지 새 단계로 갈지 선택하는 각성의 카드다.",M21:"긴 과정이 하나의 완성된 형태로 닫힌다. 성취를 인정하고 배운 것을 통합한 뒤 다음 사이클로 넘어간다."};
const reverseMajor={M00:"무모한 도약, 준비 부족, 혹은 반대로 두려워 시작하지 못하는 상태를 본다.",M01:"능력은 있지만 집중이 흩어지거나 기술을 잘못 쓰는 상태다. 말보다 실제 실행과 의도를 점검한다.",M02:"직감을 무시하거나 비밀과 혼란에 갇힐 수 있다. 느낌과 사실을 구분한다.",M03:"과보호, 창작 정체, 자기 돌봄 부족처럼 성장의 흐름이 막힌 상태를 본다.",M04:"통제가 지나쳐 경직되거나 반대로 구조가 무너진 상태다. 필요한 경계만 남긴다.",M05:"낡은 규칙에 얽매이거나 기존 방식에서 벗어나 자기 기준을 찾는 과정이다.",M06:"가치 불일치, 관계의 어긋남, 선택 회피를 본다. 원하는 것과 약속할 수 있는 것을 구분한다.",M07:"방향 상실, 과속, 통제력 저하를 본다. 속도보다 목표 정렬이 먼저다.",M08:"자기 의심, 감정 소진, 억눌린 분노처럼 내면의 힘이 흔들리는 상태다.",M09:"고립이 지나치거나 필요한 성찰을 피하는 상태다. 혼자 있음과 단절을 구분한다.",M10:"변화를 거부하거나 같은 패턴이 반복되는 느낌이다. 통제 가능한 부분과 아닌 부분을 나눈다.",M11:"불공정, 책임 회피, 자기합리화를 경계한다. 판단 전에 사실과 자신의 몫을 다시 확인한다.",M12:"의미 없는 희생, 지연, 놓지 못함을 본다. 기다림이 실제 통찰을 만드는지 확인한다.",M13:"끝난 것을 붙잡아 변화가 지연되는 상태다. 무엇을 놓아야 하는지가 핵심이다.",M14:"균형이 깨지고 과하거나 부족한 상태다. 속도를 낮추고 조합을 다시 맞춘다.",M15:"속박을 알아차리고 벗어나는 과정이거나, 집착을 부정해 더 깊이 묶인 상태일 수 있다.",M16:"붕괴를 피하려 문제를 미루거나, 충격 이후 재건을 시작하는 단계다.",M17:"희망 저하, 회복에 대한 불신을 본다. 작은 회복의 증거부터 확인한다.",M18:"혼란이 걷히기 시작하거나 반대로 불안과 자기기만이 깊어진다. 확인 가능한 정보가 중요하다.",M19:"기쁨이 줄거나 성과를 충분히 누리지 못하는 상태다. 지나친 낙관도 점검한다.",M20:"자기비판, 과거에 대한 미련, 중요한 결정을 미루는 상태다. 이미 배운 교훈을 인정한다.",M21:"마무리가 덜 되었거나 완성 직전의 지연이다. 빠진 조각을 확인하고 끝맺는다."};
function rank(c){return c.family==="Major"?0:Number(c.id.slice(1))}
function imageCode(c){if(c.family==="Major")return "ar"+c.id.slice(1);const pre={Wands:"wa",Cups:"cu",Swords:"sw",Pentacles:"pe"}[c.family],r=rank(c);return pre+(r===1?"ac":r<=10?String(r).padStart(2,"0"):r===11?"pa":r===12?"kn":r===13?"qu":"ki")}
function imageUrl(c){return "https://raw.githubusercontent.com/seven102161/elaine-tarot-cards/main/cards/"+imageCode(c)+".jpg"}
function core(c){if(c.family==="Major")return majorMeaning[c.id];const k=c.keywords.split(",").map(x=>x.trim());return `${c.ko}는 ${suitSymbol[c.family]} ${rankLesson[rank(c)]} 이 카드에서는 특히 ‘${k.slice(0,3).join(" · ")}’의 흐름을 본다.`}
function symbol(c){if(c.family==="Major")return majorSymbol[c.id];return `${suitSymbol[c.family]} ${rankLesson[rank(c)]} 카드 그림에서 인물의 시선·몸의 방향, ${c.family==="Wands"?"완드가 향하는 방향과 움직임":c.family==="Cups"?"컵이 채워져 있는지와 인물 사이의 거리":c.family==="Swords"?"검의 방향과 하늘의 분위기":"펜타클의 배치와 일·집·몸의 상태"}를 먼저 관찰하면 의미를 외우기 쉽다.`}
function upright(c){if(c.family==="Major")return majorMeaning[c.id];const k=c.keywords.split(",").map(x=>x.trim());return `정방향에서는 ${k.slice(0,3).join("·")}이 비교적 자연스럽게 밖으로 드러난다. ${rankLesson[rank(c)]} 질문 속 상황에서 이 에너지가 어디에서 실제로 작동하는지 찾는다.`}
function reversed(c){if(c.family==="Major")return reverseMajor[c.id];const k=c.keywords.split(",").map(x=>x.trim());return `역방향은 정방향의 반대말 하나로 외우기보다 ‘막힘·과잉·부족·내면화·지연’ 중 무엇인지 본다. 이 카드의 ${k[0]} 또는 ${k[1]||k[0]}이 지나치거나 제대로 표현되지 않는 지점을 확인한다.`}
function readingPoint(c,rev){const k=c.keywords.split(",").map(x=>x.trim());return rev?`먼저 “${k[0]}이 막히거나 과해진 부분은 어디인가?”를 묻는다. 카드가 나쁘다고 결론내리기보다 정방향의 힘을 건강하게 회복하려면 무엇을 조정할지 읽는다.`:`먼저 “지금 상황에서 ${k[0]}이 어디에 나타나는가?”를 묻고, 두 번째로 “그 흐름을 살리려면 어떤 행동이 필요한가?”를 본다. 카드 한 장은 사건 확정보다 현재의 초점으로 읽는다.`}

const fixedQuestionReadings={"M00":[["가능성은 열려 있다. 준비만 하다 멈추기보다 시작할수록 길이 열린다.","작게라도 바로 시작해라. 다만 꼭 필요한 안전장치와 기본 계획은 챙겨라.","새로운 제안이나 예상 밖 경험이 들어오기 쉽다. 즉흥성은 즐기되 큰 결정은 확인해라."],["준비 부족이나 충동 때문에 결과가 흔들릴 수 있다. 같은 실수를 반복하지 않는지가 관건이다.","뛰어들기 전에 빠뜨린 조건과 실제 위험부터 확인해라.","충동적인 선택이나 번복이 생기기 쉽다. 재미있어 보여도 바로 결정하지 마라."]],"M01":[["잘될 가능성이 높다. 필요한 능력과 자원이 이미 있고, 실제로 쓰느냐가 성패를 가른다.","준비를 멈추고 가진 기술과 도구를 한 목표에 집중해 직접 실행해라.","기획·발표·협상·작업 시작처럼 내가 주도하는 일에 힘이 실리는 날이다."],["능력 부족보다 힘을 제대로 못 쓰는 상태다. 과장이나 잔기술에 기대면 결과가 약해진다.","보여주기보다 실제 결과에 집중하고 흩어진 에너지를 한곳에 모아라.","말은 앞서는데 실행이 늦거나 소통이 꼬일 수 있다. 약속과 전달 내용을 확인해라."]],"M02":[["아직 결과를 단정하기 이르다. 숨은 변수나 아직 드러나지 않은 정보가 있다.","서두르지 말고 자료를 더 모아라. 반복해서 마음에 걸리는 신호도 무시하지 마라.","겉의 사건보다 직감과 미묘한 분위기가 중요한 날이다. 조용히 관찰하면 정보가 보인다."],["불안·억측·숨은 정보가 판단을 흐릴 수 있어 지금 결론대로 밀면 위험하다.","느낌만 믿지 말고 사실을 확인해라. 내가 외면하는 정보가 없는지도 살펴라.","촉은 예민하지만 오해도 쉬운 날이다. 애매한 것은 혼자 해석하지 말고 확인해라."]],"M03":[["성장 가능성이 좋다. 시간과 자원을 꾸준히 투입하면 눈에 보이는 결과로 자라기 쉽다.","속도를 재촉하지 말고 잘 자랄 환경을 만들어라. 필요한 시간·돈·체력을 공급해라.","창작·생산·돌봄·생활 정비에 좋은 날이다. 몸과 환경을 편하게 만들수록 일이 풀린다."],["자원이 부족하거나 지나치게 퍼주고 있어 소진 때문에 성장세가 꺾일 수 있다.","무조건 더 주지 말고 실제 성장에 필요한 것만 남겨라. 체력·돈·시간의 낭비부터 줄여라.","남을 챙기느라 내 일이 밀리거나 과소비하기 쉽다. 내 상태부터 돌봐라."]],"M04":[["계획과 구조를 세우면 좋은 결과를 만들 가능성이 높다. 운보다 관리와 책임감이 중요하다.","목표·기한·기준을 명확히 하고 내가 통제할 수 있는 것을 관리해라.","정리·결정·책임지는 일에 강한 날이다. 미뤄둔 규칙이나 일정을 잡기 좋다."],["지나친 통제나 관리 부재가 결과를 막을 수 있다. 고집으로 밀면 더 경직된다.","통제할 것과 맡길 것을 구분하고 내 방식 자체가 현실에 맞는지 다시 봐라.","권한이나 규칙 문제로 답답할 수 있다. 힘겨루기보다 기준을 다시 합의해라."]],"M05":[["검증된 방법과 제대로 된 조언을 따르면 안정적인 결과가 나기 쉽다.","전문가·선배·기존 절차를 활용하고 기본기를 생략하지 마라.","배우거나 조언을 구하고 공식 절차를 처리하기 좋은 날이다."],["기존 방식이 지금 상황에는 맞지 않을 수 있다. 관습을 그대로 따르면 답답해진다.","규칙을 무조건 따르거나 거부하지 말고 지금도 필요한 원칙인지 판단해라.","권위나 형식과 부딪히기 쉽다. 형식 때문에 본질을 놓치지 마라."]],"M06":[["잘될 가능성은 있지만 핵심은 선택이다. 진짜 원하는 방향과 행동이 일치해야 한다.","눈앞의 이익보다 중요한 가치 기준을 정하고 선택한 뒤에는 그 방향에 집중해라.","사람과의 연결이나 중요한 선택이 중심이 된다. 마음과 행동이 같은지 확인해라."],["선택을 미루거나 원하는 것과 행동이 어긋나 결과가 흔들릴 수 있다.","누구를 만족시킬지보다 내가 무엇을 선택할지 분명히 하고 말과 행동을 맞춰라.","관계나 선택에서 마음이 갈라지기 쉽다. 애매한 약속보다 우선순위를 정해라."]],"M07":[["목표가 분명하면 빠르게 전진해 좋은 결과를 낼 수 있다. 방향 통제가 핵심이다.","목표를 하나로 좁히고 방해 요소를 관리해라. 속도보다 방향키를 놓치지 마라.","추진력이 강한 날이다. 이동·실행·결정이 빠르게 진행될 수 있다."],["속도는 나는데 방향이 흔들리거나 통제가 풀릴 수 있다. 무리하면 일정과 감정이 충돌한다.","잠깐 속도를 줄이고 무엇을 향하는지 다시 정해라. 동시에 너무 많은 것을 끌지 마라.","서두르다 실수하거나 일정이 꼬이기 쉽다. 이동과 결정에 여유를 둬라."]],"M08":[["충분히 해낼 힘이 있다. 강압보다 인내와 자기조절이 좋은 결과를 만든다.","억지로 제압하지 말고 차분하게 반복해라. 두려워도 행동을 끊지 않는 것이 중요하다.","감정적으로 흔들릴 일이 있어도 침착하게 대응하면 내 힘을 확인할 수 있다."],["자신감 저하나 억눌린 감정 때문에 실력보다 불안이 결과를 결정할 수 있다.","스스로를 몰아붙이지 말고 체력과 감정을 회복해라. 필요한 감정은 인정하고 조절해라.","사소한 일에도 예민하거나 자신감이 흔들릴 수 있다. 중요한 대응은 진정한 뒤 해라."]],"M09":[["빠른 성과보다 깊이 파고들어 정확한 답을 찾을 때 좋은 결과의 기반이 생긴다.","외부 평가를 잠시 끊고 핵심 문제를 혼자 검토해라. 최종 판단은 스스로 내려라.","혼자 공부·생각·정리하기 좋은 날이다. 조용한 시간이 답을 준다."],["혼자 생각하는 시간이 지나쳐 고립과 망설임이 되고 있다. 타이밍을 놓칠 수 있다.","생각이 충분했다면 밖으로 나와 검증해라. 신뢰할 사람의 도움도 받아라.","혼자 있고 싶은 마음이 강하다. 필요한 휴식은 취하되 현실적인 연락까지 끊지는 마라."]],"M10":[["상황이 움직이기 시작한다. 기회가 들어올 수 있고 타이밍을 잡으면 결과가 크게 바뀐다.","모든 것을 통제하려 하지 말고 변화를 읽어라. 기회가 왔을 때 움직일 준비를 해라.","예상 못 한 변화나 우연이 흐름을 바꿀 수 있다. 계획 변경이 기회가 되기도 한다."],["흐름이 지연되거나 같은 문제가 반복될 수 있다. 바뀌어야 할 패턴을 붙잡고 있을 가능성이 크다.","안 풀리는 방식을 반복하지 말고 패턴을 찾아라. 타이밍이 아니면 기다리며 수정해라.","일정 변경과 작은 엇박자가 생기기 쉽다. 계획에 여유를 둬라."]],"M11":[["조건을 제대로 지켰다면 그에 맞는 결과가 돌아올 가능성이 높다. 사실과 책임이 중요하다.","자료·계약·숫자·약속을 정확히 확인하고 상대 기준에서도 공정한지 봐라.","판단·정리·결론에 좋은 날이다. 서류나 약속 문제를 정확히 처리해라."],["편향된 판단, 불공정한 조건, 책임 회피가 결과를 어긋나게 할 수 있다.","억울함보다 사실관계를 확인해라. 내 책임은 인정하고 부당한 조건은 근거로 바로잡아라.","말이 엇갈리거나 불공정하다고 느낄 수 있다. 기록과 사실부터 확인해라."]],"M12":[["지금 당장 원하는 결과보다 멈춤이 필요한 카드다. 관점을 바꾸면 이후 길이 열린다.","억지로 해결하지 말고 한 번 놓아라. 반대 입장에서 보고 포기해야 할 방식을 찾아라.","계획이 느려지거나 기다릴 일이 생길 수 있다. 그 시간을 관점 전환에 써라."],["기다림이 숙성이 아니라 시간 끌기가 되고 있다. 계속 미루면 저절로 좋아지지 않는다.","이미 충분히 기다렸다면 결정해라. 얻는 것 없는 희생은 중단해라.","답답한 정체감이 들 수 있다. 작은 결정 하나라도 끝내라."]],"M13":[["현재 모습 그대로는 유지되지 않는다. 낡은 단계를 끝내면 새 결과가 열릴 수 있다.","역할이 끝난 방식·계획을 정리해라. 무엇을 살릴지보다 무엇을 끝낼지 먼저 봐라.","정리와 전환에 강한 날이다. 오래 끌던 일을 끝내면 새 공간이 생긴다."],["변화가 필요한데 붙잡고 있어 결과가 지연된다. 같은 문제를 반복할 가능성이 크다.","이미 끝난 부분을 인정하고 단계적으로 전환을 시작해라.","놓기 싫은 것 때문에 마음이 무거울 수 있다. 하나라도 실제로 정리해라."]],"M14":[["급격한 대박보다 안정적으로 잘될 가능성이 높다. 조절과 균형이 성패를 가른다.","극단적으로 몰지 말고 부족한 것은 보완하고 과한 것은 줄여라.","일정·감정·사람 사이의 균형을 맞추기 좋은 날이다."],["균형이 깨져 지금 방식 그대로는 결과가 흔들릴 수 있다. 과속·과로·과잉을 점검해라.","한꺼번에 해결하지 말고 과한 것부터 줄여라. 어디서 균형이 무너졌는지 찾아라.","리듬이 깨지고 작은 일이 겹칠 수 있다. 일정을 더 넣기보다 빈틈을 만들어라."]],"M15":[["결과를 낼 욕망은 강하지만 대가를 봐야 한다. 집착이나 불리한 조건에 묶이면 성공해도 만족하기 어렵다.","원하는 것과 놓지 못하는 것을 구분해라. 돈·인정·습관 중 나를 통제하는 조건을 바꿔라.","유혹과 욕심이 강해질 수 있다. 과소비·과로·집착의 선을 정해라."],["묶여 있던 문제에서 벗어날 가능성이 생긴다. 나쁜 패턴을 끊으면 결과가 개선될 수 있다.","나를 묶는 습관이나 조건 하나를 정확히 정하고 실제로 끊기 시작해라.","부담스러운 습관이나 관계에서 거리를 두기 좋은 날이다."]],"M16":[["현재 계획의 전제가 틀렸다면 그대로 좋은 결과는 어렵다. 갑작스러운 수정이 필요할 수 있다.","무너지는 것을 붙잡지 말고 무엇이 처음부터 불안정했는지 찾아 핵심만 남겨 다시 짜라.","예상 밖 소식이나 일정 변경이 생길 수 있다. 드러난 문제를 바로 처리해라."],["큰 충격은 피하고 있지만 문제는 남아 있다. 경고를 계속 무시하면 균열이 오래 간다.","이미 알고 있는 문제를 미루지 말고 위험한 부분을 선제적으로 고쳐라.","‘이대로 두면 안 된다’는 신호가 보이기 쉽다. 작은 고장을 즉시 고쳐라."]],"M17":[["좋은 결과를 기대할 만하다. 당장 완성보다 회복과 장기 가능성이 살아 있는 카드다.","조급하게 증명하지 말고 방향을 믿으며 계속해라. 지친 부분을 회복해라.","희망이나 좋은 아이디어를 되찾기 쉬운 날이다. 마음을 맑게 하는 일에 시간을 써라."],["가능성이 사라진 것은 아니지만 자신감 상실이 흐름을 약하게 만들고 있다.","비관적으로 단정하지 말고 작은 회복의 증거부터 확인해라. 비교보다 내 방향을 잡아라.","의욕이 떨어지거나 미래가 흐릿할 수 있다. 큰 결론보다 회복에 집중해라."]],"M18":[["아직 잘된다/안 된다를 확정하기 어렵다. 정보가 불분명하고 불안과 기대가 섞여 있다.","추측으로 빈칸을 채우지 말고 사실을 늘려라. 중요한 결정은 검증한 뒤 해라.","감정과 직감이 예민하다. 창작에는 좋지만 계약·결정은 재확인이 필요하다."],["혼란의 원인이 드러나기 시작한다. 사실을 직면하면 막연한 불안은 줄어든다.","애매함을 끝내기 위해 직접 확인해라. 숨긴 감정이나 회피한 사실을 인정해라.","헷갈리던 일이 정리되거나 오해가 풀릴 수 있다. 새 확신도 한 번 검증해라."]],"M19":[["매우 긍정적이다. 노력한 것이 드러나고 성취나 인정으로 이어질 가능성이 높다.","자신 있게 결과를 보여줘라. 명확하고 단순하게 행동하고 성과를 충분히 누려라.","활력과 자신감이 올라간다. 사람을 만나거나 결과를 공개하기 좋은 날이다."],["좋은 가능성은 있지만 기대만큼 만족하지 못하거나 성과가 늦을 수 있다.","완벽해야 성공이라는 기준을 낮춰라. 이미 나온 성과를 인정하고 부족한 부분만 보완해라.","큰 문제는 없어도 기분이 덜 뜰 수 있다. 남의 반응보다 실제로 잘된 것을 봐라."]],"M20":[["중요한 전환점이다. 과거 경험을 제대로 평가하고 결정하면 다음 단계로 갈 가능성이 높다.","무엇이 잘됐고 실패했는지 평가해 같은 실수를 반복하지 않는 결정을 내려라.","과거 일이나 미뤄둔 결정이 다시 떠오른다. 이번에는 결론을 낼 기회다."],["기회 부족보다 자기 의심과 결정 미루기가 결과를 막고 있을 수 있다.","남의 평가보다 내가 배운 것을 기준으로 결정해라. 자책보다 다른 선택을 해라.","예전 실수나 후회가 떠오를 수 있다. 이번에는 어떻게 할지 정하면 흐름이 바뀐다."]],"M21":[["완성 가능성이 매우 높다. 쌓아온 것이 하나의 결과로 정리되고 목표 단계에 도달할 수 있다.","마지막 세부 작업까지 끝내고 결과를 정식으로 닫은 뒤 다음 목표로 넘어가라.","완료·제출·마감·성취에 좋은 날이다. 오래 해온 일을 끝낼 수 있다."],["거의 다 왔지만 마무리 부족 때문에 완성감이 늦어질 수 있다.","새 일을 벌이기 전에 남은 한두 가지를 끝내라. 대충 넘긴 부분을 최종 점검해라.","끝낼 일이 남아 찜찜할 수 있다. 시작보다 마무리에 시간을 써라."]],"W01":[["시작하기 좋은 강한 신호다. 아이디어나 의욕을 행동으로 옮기면 빠르게 불이 붙는다.","생각을 더 다듬기보다 작은 형태라도 바로 시작해라.","새 아이디어나 하고 싶은 일이 생기기 쉽다. 먼저 움직일수록 에너지가 산다."],["의욕은 있지만 시작이 안 되거나 금방 식을 수 있다. 에너지 분산이 문제다.","목표를 작게 줄여 다시 불을 붙여라. 새 아이디어를 더 찾지 마라.","마음과 체력이 엇갈릴 수 있다. 새 일보다 에너지 회복이 우선이다."]],"W02":[["가능성은 있지만 아직 선택과 계획 단계다. 방향을 정해야 결과가 움직인다.","두 선택지의 현실 조건을 비교하고 하나를 정해 다음 행동을 예약해라.","앞으로의 방향을 계획하기 좋은 날이다. 익숙한 범위 밖 선택지가 보인다."],["두려움 때문에 확장을 못 하고 있다. 결정을 미루면 타이밍을 놓칠 수 있다.","완벽한 확신을 기다리지 말고 가장 큰 위험만 대비한 뒤 작은 확장을 해라.","선택 앞에서 망설이기 쉽다. 내가 감당할 범위를 먼저 정해라."]],"W03":[["이미 시작했다면 성장과 확장 가능성이 좋다. 초반 행동의 반응이 돌아오기 시작한다.","눈앞 일만 보지 말고 다음 단계·시장·사람을 준비해라.","전에 해둔 일이 반응을 보이거나 새로운 가능성이 보이기 쉽다."],["기대한 확장이 늦거나 계획이 좁아질 수 있다. 기다리기만 하면 정체된다.","지연 원인을 확인하고 규모를 조정해라. 다른 통로나 대안도 찾아라.","답변·진행이 늦을 수 있다. 실패로 단정하지 말고 대안을 준비해라."]],"W04":[["안정적인 좋은 결과가 기대된다. 한 단계가 자리 잡고 축하할 성과로 이어지기 쉽다.","성과를 주변과 공유하고 다음 단계 전에 현재 기반을 굳혀라.","사람들과 편안하게 어울리거나 작은 성취를 축하하기 좋은 날이다."],["겉으로 끝나 보여도 기반이 불안정할 수 있다. 내부 분위기와 역할을 다시 봐라.","축하를 서두르지 말고 일정·역할·환경의 빈틈부터 정리해라.","집안일·약속·모임에서 작은 엇박자가 생길 수 있다. 기본을 정리해라."]],"W05":[["쉽게 풀리진 않는다. 경쟁과 의견 충돌을 거치지만 실력을 다듬으면 결과는 만들 수 있다.","모든 싸움에 반응하지 말고 내 실력을 높이는 경쟁만 선택해라.","의견이 많고 일이 산만해지기 쉽다. 작은 충돌을 개인 공격으로 받지 마라."],["불필요한 싸움은 줄지만 갈등을 덮기만 했다면 문제가 남는다.","이겨야 할 싸움과 끝내야 할 싸움을 구분하고 핵심 쟁점만 다뤄라.","싸움을 피하고 싶어진다. 넘길 일은 넘기되 꼭 말할 문제는 미루지 마라."]],"W06":[["좋은 결과와 인정 가능성이 높다. 노력한 것이 보이고 성과로 평가받기 쉽다.","성과를 적절히 보여줘라. 칭찬에만 기대지 말고 다음 품질도 유지해라.","칭찬·좋은 반응·작은 승리를 경험하기 쉽다. 발표와 결과 공유에 유리하다."],["기대한 인정이 늦거나 생각만큼 주목받지 못할 수 있다.","반응보다 결과 품질을 확인하고 홍보 부족인지 실력 부족인지 구분해라.","인정받고 싶은 마음이 커질 수 있다. 실제 성과를 스스로 확인해라."]],"W07":[["압박은 있지만 현재 위치를 지켜낼 힘이 있다. 기준을 지키면 결과로 이어진다.","모두를 설득하려 하지 말고 지켜야 할 핵심을 정해 단호하게 지켜라.","내 입장과 시간을 지켜야 할 일이 생길 수 있다. 필요한 거절을 해라."],["압박에 지쳐 방어력이 떨어지고 있다. 모든 요구를 막으려다 핵심을 놓칠 수 있다.","우선순위를 정하고 중요하지 않은 싸움에서는 내려와라. 도움도 요청해라.","요구가 많아 피곤할 수 있다. 일정과 연락을 줄여 에너지를 보호해라."]],"W08":[["빠르게 진행될 가능성이 높다. 막힌 일이 움직이고 연락·결정·실행이 이어진다.","기회에 바로 대응할 준비를 해라. 고민으로 속도를 끊지 말되 일정은 확인해라.","연락과 일이 빠르게 오간다. 짧은 시간에 많은 진전이 생길 수 있다."],["진행·연락·일정이 지연되거나 엇갈릴 수 있다. 서두르면 더 늦어진다.","속도를 억지로 높이지 말고 병목을 찾아 메시지·날짜·순서를 확인해라.","답변 지연과 일정 변경이 생기기 쉽다. 약속과 메시지를 두 번 확인해라."]],"W09":[["쉽진 않지만 거의 버텨낸 상태다. 마지막 고비를 넘기면 결과를 지킬 수 있다.","실패 경험을 방어책으로 쓰고 남은 힘을 관리하며 마지막 구간을 끝내라.","조금 지쳐도 할 일을 지켜낼 수 있다. 체력을 아끼고 문제를 미리 대비해라."],["지쳐서 과도하게 경계하거나 포기하고 싶어질 수 있다. 버티기만 하면 악화된다.","의지만으로 버티지 말고 쉬어라. 실제 위험과 과거의 두려움을 구분해라.","피로 때문에 방어적으로 반응하기 쉽다. 중요한 판단보다 회복을 우선해라."]],"W10":[["성과는 낼 수 있지만 부담이 크다. 혼자 다 짊어지면 성공해도 소진된다.","꼭 해야 할 일과 넘길 일을 나눠라. 같은 부담 구조를 반복하지 마라.","할 일이 몰려 바쁘다. 우선순위가 없으면 하루가 무겁다."],["부담을 내려놓으면 좋아질 수 있다. 반대로 책임 회피는 일을 더 꼬이게 한다.","불필요한 책임은 내려놓고 필요한 책임은 맡아라. 짐을 목록으로 줄여라.","쌓인 일을 정리하거나 거절하기 좋은 날이다."]],"W11":[["새 가능성이 있다. 경험은 부족해도 호기심과 빠른 학습이 결과를 키운다.","재미있는 방향을 직접 시험해라. 전문가처럼 보이려 하지 말고 배우며 실행해라.","새 소식이나 아이디어가 들어오기 쉽다. 안 해본 것을 가볍게 시도하기 좋다."],["아이디어는 많지만 집중이 약해 시작만 반복할 수 있다.","새것을 더 찾지 말고 하나를 골라 끝까지 시험해라. 약속은 지켜라.","흥미가 자주 바뀌어 산만할 수 있다. 지금 하던 일을 먼저 확인해라."]],"W12":[["속도와 추진력이 강해 결과를 빠르게 움직일 수 있다. 돌파가 필요한 상황에 좋다.","기세를 살려 행동하되 마무리 일정과 책임을 붙여라.","활동량과 즉흥 제안이 많다. 움직이면 재미있지만 무리한 일정은 피하라."],["성급함과 방향 변경이 결과를 흔들 수 있다. 시작했다 금방 흥미를 잃기 쉽다.","속도를 줄이고 한 번 정한 방향을 일정 기간 유지해라. 화난 상태에서 약속하지 마라.","마음이 급하고 짜증이 나기 쉽다. 충동적인 연락·구매·결정은 미뤄라."]],"W13":[["자신감과 매력으로 주도하면 좋은 결과를 만들 가능성이 높다.","능력을 숨기지 말고 적극적으로 보여줘라. 사람을 함께 움직이게 만들어라.","사람들과 어울리고 창작·표현하기 좋다. 자신 있게 행동할수록 분위기가 산다."],["자신감이 질투나 예민함으로 바뀌면 결과가 흔들린다.","비교를 멈추고 내 강점에 집중해라. 인정받으려 과장하지 마라.","사소한 비교에도 기분이 흔들릴 수 있다. 남의 반응보다 내 할 일에 집중해라."]],"W14":[["큰 그림을 보고 주도하면 성공 가능성이 높다. 경험과 추진력을 장기 방향으로 묶을 수 있다.","모든 일을 직접 하지 말고 방향을 정해 사람과 자원을 배치해라.","결정력과 추진력이 좋다. 중요한 일을 주도하거나 계획을 확정하기 좋다."],["자신감이 독단과 무리한 야심으로 흐르면 반발 때문에 결과가 나빠진다.","내가 옳다는 확신을 내려놓고 피드백을 받아라. 목표는 유지하되 방법을 조율해라.","주도권 싸움이나 성급한 지시가 생길 수 있다. 상대 입장을 먼저 확인해라."]],"C01":[["마음이 움직이는 일이라면 좋은 시작이다. 관계·창작·좋아하는 일에서 만족스러운 결과 가능성이 높다.","좋은 감정과 제안을 받아들이고 진짜 좋아하는 이유를 행동에 연결해라.","기분 좋은 연락이나 감정의 새 출발이 생기기 쉽다. 창작과 관계에 따뜻한 흐름이다."],["마음이 닫혀 있거나 감정이 넘쳐 좋은 기회도 제대로 받기 어렵다.","억지로 긍정적이려 하지 말고 서운함·피로를 먼저 비우고 회복해라.","감정 기복이나 마음의 여유 부족이 있을 수 있다. 내 상태부터 돌봐라."]],"C02":[["협력이나 관계가 중요한 일이라면 매우 좋다. 서로의 의도와 조건이 맞을수록 원하는 결과에 가까워진다.","믿을 만한 상대와 직접 합의하고 주고받는 조건이 균형적인지 확인해라.","마음이 잘 통하는 대화나 협력이 생기기 쉽다. 중요한 사람과 이야기하기 좋다."],["합의가 어긋나거나 관계 균형이 깨져 결과가 흔들릴 수 있다.","상대 의도를 추측하지 말고 직접 확인해라. 한쪽만 맞추고 있다면 조건을 다시 잡아라.","가까운 사람과 서운함이나 오해가 생길 수 있다. 오래 끌지 말고 바로 풀어라."]],"C03":[["사람들과 협력하고 도움을 주고받으면 좋은 결과가 나기 쉽다. 팀의 힘이 크다.","성과를 공유하고 필요한 사람에게 도움을 요청해라. 역할을 함께 나누면 동력이 커진다.","모임·대화·협업에서 즐거움이 생기기 쉽다. 사람을 통해 좋은 정보가 들어온다."],["소문·과한 친목·역할 불균형이 결과를 방해할 수 있다. 사람이 많다고 도움이 되는 건 아니다.","핵심 인원과 역할을 분명히 하고 뒷말과 분위기에 에너지를 쓰지 마라.","모임이 피곤하거나 말이 많아 실수하기 쉽다. 남의 이야기를 가볍게 옮기지 마라."]],"C04":[["좋은 기회가 있어도 권태 때문에 놓칠 수 있다. 결과보다 무관심이 성과를 막는 상태다.","새것을 찾기 전에 이미 들어온 제안과 자원을 다시 봐라. 지쳤다면 잠깐 쉬어라.","의욕이 떨어지고 모든 것이 비슷해 보일 수 있다. 작은 변화가 필요하다."],["정체에서 벗어나 관심이 살아나기 시작한다. 제안을 받아들이면 결과도 움직일 수 있다.","오래 고민한 선택지가 있다면 이제 직접 시험해라. 작은 행동으로 반응을 확인해라.","무기력이 풀리고 움직이고 싶어진다. 미뤘던 연락이나 일을 다시 시작하기 좋다."]],"C05":[["기대한 것과 다른 결과나 손실이 있을 수 있다. 하지만 전부 실패한 것은 아니며 남은 가능성이 있다.","이미 잃은 것보다 남은 자원과 관계를 확인해 복구 가능한 것부터 살려라.","아쉬운 일이나 지난 실수가 마음에 걸릴 수 있다. 괜찮은 부분까지 놓치지 마라."],["실망에서 회복하기 시작한다. 과거 실패를 놓고 다시 움직이면 결과를 되돌릴 수 있다.","후회에서 교훈만 남기고 행동을 재개해라. 사과·복구할 일이 있으면 시작해라.","묵은 감정을 정리하고 회복하기 좋다. 오래 미룬 화해나 정리를 시도해볼 수 있다."]],"C06":[["과거 경험이나 익숙한 방식이 도움이 될 수 있다. 다만 현재에도 유효한지 확인해야 좋은 결과가 난다.","예전에 잘된 방법의 핵심만 가져와 지금 상황에 맞게 수정해라.","옛사람·추억·예전 일이 떠오르기 쉽다. 편안함을 얻되 현재 할 일을 놓치지 마라."],["과거 방식과 기대에 매이면 좋은 결과가 나오기 어렵다. 예전 성공·실패를 현재에 그대로 대입하는 게 방해다.","‘예전에는 이랬다’는 기준을 내려놓고 지금 조건을 새로 판단해라. 익숙함보다 현재 효과를 검증해라.","과거 일이나 사람 때문에 현재 기분이 흔들릴 수 있다. 지금 바꿀 수 있는 행동에 집중해라."]],"C07":[["가능성은 많지만 결과는 아직 확정되지 않았다. 선택지가 너무 많거나 환상이 섞여 있다.","매력적인 선택지를 현실 조건으로 검증해 하나를 골라라. 비용·시간·실행 가능성을 비교해라.","아이디어와 상상이 많다. 창작에는 좋지만 구매와 큰 결정은 현실 조건을 봐라."],["혼란이 줄고 무엇을 선택할지 보이기 시작한다. 하나에 집중하면 결과가 현실화될 수 있다.","가능성 탐색을 끝내고 선택해라. 아닌 옵션은 지우고 현실적인 하나에 행동을 붙여라.","머릿속이 정리되고 결정을 내리기 쉬운 날이다. 미룬 선택 하나를 확정해라."]],"C08":[["현재 방식에서 만족을 얻기 어렵다면 떠나거나 방향을 바꿔야 좋은 결과가 가능하다.","의미가 끝난 부분을 인정해라. 아깝다는 이유로 남지 말고 더 중요한 목표로 이동해라.","마음이 예전 같지 않은 일에서 거리를 두고 싶어진다. 혼자 정리할 시간이 필요하다."],["떠나야 함을 알면서도 미련 때문에 돌아가거나 성급히 포기하려 해 결정이 반복될 수 있다.","남을지 떠날지 기준을 정해라. 두려움 때문에 남는지 가치가 남아서인지 구분해라.","끝낼지 계속할지 마음이 오락가락할 수 있다. 감정마다 결정을 바꾸지 마라."]],"C09":[["원하는 결과에 가까운 매우 긍정적인 카드다. 바라던 일이 이루어지고 만족할 가능성이 높다.","이미 잘되는 부분을 인정하고 결과를 즐겨라. 마지막 확인과 배려만 놓치지 마라.","기분 좋은 결과나 작은 소원이 이루어질 수 있다. 즐기되 과소비·과식은 조심해라."],["원하는 것을 얻어도 만족이 부족하거나 기대가 너무 높아 실망할 수 있다.","왜 이것을 원했는지 다시 봐라. 과시나 즉각 만족보다 실제 필요한 것을 채워라.","욕구가 커져 소비·먹는 것·인정에 과해지기 쉽다. 내일도 만족할 선택을 해라."]],"C10":[["장기적으로 매우 좋은 결과를 기대할 수 있다. 성취를 주변과 함께 나누는 안정과 만족의 카드다.","혼자만의 성공보다 관계와 생활 전체가 좋아지는 방향을 선택하고 목표를 공유해라.","가까운 사람과 편안함과 만족을 느끼기 좋다. 집·가족·친한 관계에 좋은 날이다."],["겉은 괜찮아도 관계나 생활 균형이 깨져 있을 수 있다. 결과만 얻어서는 만족하기 어렵다.","성과와 관계 중 하나를 희생하는 구조인지 보고 완벽한 모습보다 실제 불편을 대화해라.","가까운 사람과 기대가 어긋나 서운할 수 있다. 완벽한 분위기보다 솔직한 대화가 낫다."]],"C11":[["좋은 소식이나 새로운 감정적 가능성이 있다. 아직 작지만 열린 마음으로 키우면 발전할 수 있다.","처음부터 확신을 요구하지 말고 호기심을 따라가라. 느낀 것을 부드럽게 표현해라.","뜻밖의 연락이나 마음을 움직이는 일이 생길 수 있다. 감성을 쓰는 작업에도 좋다."],["감정이 미숙하게 표현되거나 작은 신호를 과대해석해 결과를 잘못 판단할 수 있다.","상상과 사실을 구분해라. 기분이 상했다고 결론내리지 말고 직접 확인해라.","감정이 쉽게 상하거나 엉뚱한 기대를 할 수 있다. 메시지 하나에 큰 의미를 붙이지 마라."]],"C12":[["마음이 원하는 방향으로 움직일 기회가 있다. 제안·관계·창작이라면 좋은 흐름이다.","좋은 마음을 행동으로 표현해라. 분위기에 취해 지키기 어려운 약속까지 하지는 마라.","기분 좋은 제안이나 로맨틱한 분위기가 생기기 쉽다. 창작과 만남에 좋다."],["말은 아름답지만 행동이 따르지 않을 수 있다. 이상화하면 현실과 기대가 크게 달라진다.","좋은 말보다 실제 행동과 지속성을 확인해라. 감정이 가라앉은 뒤 결정해라.","기분에 따라 계획을 바꾸거나 누군가를 과하게 이상화하기 쉽다. 약속을 확인해라."]],"C13":[["감정과 사람을 섬세하게 읽는 능력이 결과에 도움이 된다. 공감하되 중심을 지키면 좋다.","상대와 내 감정을 인정하되 대신 책임지지 마라. 조용히 듣고 정확히 반응해라.","감수성이 높고 사람 마음을 잘 읽는다. 창작과 깊은 대화에 좋은 날이다."],["감정에 휩쓸리거나 남의 기분을 내 책임처럼 느끼면 판단과 결과가 흔들린다.","공감하되 경계를 세워라. 내 감정과 상대 감정을 구분한 뒤 결정해라.","예민하고 감정 소모가 커질 수 있다. 남의 분위기를 그대로 받아들이지 마라."]],"C14":[["감정을 안정적으로 다루면 좋은 결과를 만들 수 있다. 복잡한 상황에서 침착함이 강점이다.","감정을 숨기지 말되 행동을 지배하게 하지 마라. 이해한 뒤 차분히 결정해라.","주변 감정이 복잡해도 중심을 유지하기 좋다. 상담·대화·중재에 강하다."],["감정을 억누르다 폭발하거나 냉정한 척 속으로 흔들릴 수 있다. 이 상태의 결정은 왜곡된다.","감정이 올라왔음을 인정하고 회피로 덮지 마라. 안전하게 표현한 뒤 결론내라.","겉으로 괜찮아도 속은 예민할 수 있다. 무리해 침착한 척하지 말고 쉬어라."]],"S01":[["문제의 핵심을 정확히 보면 좋은 결과로 갈 수 있다. 명확한 판단이 막힌 상황을 뚫는다.","추측을 걷어내고 사실을 한 문장으로 정리해 필요한 결정과 대화를 시작해라.","머리가 맑아지고 중요한 결론을 내리기 좋다. 문서·기획·대화에 유리하다."],["판단이 흐리거나 잘못된 정보 때문에 결과가 꼬일 수 있다. 말실수도 조심해야 한다.","결론부터 내리지 말고 자료를 다시 확인해라. 공격보다 원하는 것을 정확히 말해라.","오해나 말실수가 생기기 쉽다. 중요한 메시지와 문서를 다시 읽어라."]],"S02":[["결정을 미뤄 결과가 멈춰 있다. 어느 쪽이든 선택해야 흐름이 시작된다.","불편한 정보까지 보고 완벽한 선택보다 감당 가능한 쪽을 정해라.","선택을 미루고 싶은 일이 생긴다. 오늘 안에 기준 하나는 정해라."],["피하던 사실이 드러나 더는 결정을 미루기 어려워진다. 정체를 끝낼 기회이기도 하다.","정보를 더 모으기보다 핵심 기준으로 정리해 감정이 가라앉은 뒤 선택해라.","미룬 문제를 마주할 수 있다. 결정 하나를 끝내면 마음이 가벼워진다."]],"S03":[["실망이나 아픈 사실을 거쳐야 할 수 있다. 원하는 모습 그대로의 성공은 어렵지만 회복은 가능하다.","아픈 사실을 부정하지 말고 무엇이 잘못됐는지 본 뒤 손실을 줄여라.","서운한 말이나 실망스러운 소식에 예민할 수 있다. 하루 전체를 그 일로 판단하지 마라."],["상처에서 회복하는 단계다. 문제를 되새기기보다 정리하면 상황이 개선된다.","필요한 사과·치료·정리를 하고 다음 행동으로 넘어가라.","마음에 걸리던 일이 가벼워질 수 있다. 묵힌 감정을 정리하기 좋다."]],"S04":[["지금은 밀어붙이기보다 쉬고 재정비해야 결과가 좋아진다. 무리하면 효율이 떨어진다.","잠시 멈추고 체력과 생각을 회복해라. 중요한 결정은 쉰 뒤 해라.","속도를 낮추고 혼자 쉬기 좋은 날이다. 빈 시간을 만들면 머리가 정리된다."],["너무 오래 멈췄거나 제대로 쉬지 못해 피로가 누적됐다. 회복 방식을 바꿔야 한다.","고민만 반복하지 말고 수면·산책·일정 축소 후 작은 일부터 다시 시작해라.","쉬어도 개운하지 않을 수 있다. 화면과 생각을 줄이고 몸을 실제로 쉬게 해라."]],"S05":[["이길 수 있어도 대가가 큰 싸움이다. 결과만 얻고 신뢰를 잃으면 좋은 성공이 아니다.","무엇을 얻으려 싸우는지 확인하고 자존심만 남는 논쟁은 멈춰라.","말싸움이나 신경전이 생기기 쉽다. 이기려는 말보다 끝내는 말을 선택해라."],["갈등을 끝내고 수습할 기회가 있다. 원망을 붙잡으면 같은 싸움이 반복된다.","누가 이겼는지보다 무엇을 회복할지 정하고 잘못한 부분은 인정해라.","불편했던 사람과 긴장이 풀릴 수 있다. 먼저 공격하지 않으면 정리하기 쉽다."]],"S06":[["지금보다 나은 쪽으로 이동한다. 대박보다 문제 구간을 벗어나 점차 안정되는 결과다.","과거 문제 분석을 멈추고 필요한 것만 챙겨 다음 단계로 이동해라.","복잡했던 일이 잦아든다. 이동·정리·거리 두기가 마음을 편하게 한다."],["벗어나야 할 문제로 계속 돌아오거나 이동이 지연될 수 있다.","무엇 때문에 떠나지 못하는지 찾아 미련·두려움·미완료 중 하나를 정리해라.","끝난 일을 자꾸 생각하거나 계획이 지연될 수 있다. 남은 짐 하나를 정리해라."]],"S07":[["정면승부보다 전략이 필요한 상황이다. 잘 설계하면 결과를 얻지만 편법은 신뢰 문제를 만든다.","모든 계획을 공개할 필요는 없지만 스스로에게는 정직해라. 우회와 부정의 경계를 지켜라.","혼자 조용히 처리할 일이 잘 맞는다. 중요한 사실을 숨겨 나중 문제를 만들지는 마라."],["숨기던 사실이나 허술한 계획이 드러날 수 있다. 인정하고 수정하면 큰 문제는 피한다.","핑계를 더 만들지 말고 사실을 정리해라. 들키지 않는 법보다 바로잡는 법을 택해라.","비밀이나 미룬 문제가 신경 쓰일 수 있다. 솔직하게 정리할수록 편해진다."]],"S08":[["실제 능력보다 ‘못 한다’는 생각에 묶여 결과가 막힐 수 있다. 일부 제한은 스스로 만든 것이다.","바꿀 수 없는 것과 바꿀 수 있는 것을 나눠 작은 선택권 하나부터 써라.","답답하고 선택지가 없어 보일 수 있다. 통제 가능한 작은 일 하나를 해라."],["제한에서 벗어날 방법이 보이기 시작한다. 두려워 못 한 행동을 시작하면 개선된다.","남의 허락을 기다리지 말고 선택권을 써라. 도움 요청이나 환경 변경을 실행해라.","막힌 생각이 풀리고 방법이 보일 수 있다. 작은 자유를 행동으로 옮겨라."]],"S09":[["불안이 실제보다 결과를 더 나쁘게 상상하게 한다. 머릿속 최악의 시나리오는 확정 결과가 아니다.","걱정을 사실과 가정으로 나눠 실제 해결 가능한 한 가지부터 처리해라.","걱정이 많고 잠이 불편할 수 있다. 혼자 생각을 키우지 말고 확인을 받아라."],["불안의 정점에서 내려오기 시작한다. 도움을 받으면 현실적으로 볼 여지가 생긴다.","숨긴 걱정을 밖으로 꺼내고 해결 가능한 것은 계획으로 바꿔라.","부담을 털어놓거나 걱정 하나가 해소될 수 있다. 수면과 휴식을 우선해라."]],"S10":[["현재 방식의 한계에 도달했다. 원하는 형태의 성공은 어렵지만 이 끝을 인정하면 새 출발이 가능하다.","끝난 것을 살리려 애쓰지 말고 손실을 확정해 배운 점을 다음 선택에 써라.","힘든 일 하나가 끝나거나 ‘더는 이렇게 못 한다’는 결론이 날 수 있다."],["최악의 구간을 지나 회복이 시작된다. 끝난 문제를 다시 붙잡지 않는 것이 중요하다.","바닥을 확인했다면 복구 계획을 세우고 가장 시급한 것부터 정상화해라.","어제보다 조금 나아질 수 있다. 큰 성과보다 회복 신호를 확인해라."]],"S11":[["정보를 빠르게 배우고 정확히 관찰하면 좋은 결과를 만들 수 있다. 조사와 질문이 중요하다.","직접 조사하고 출처를 확인해라. 말하기 전에 사실을 정리해라.","새 정보와 소식이 많이 들어온다. 공부·조사에는 좋지만 과민 반응은 피하라."],["정보가 부정확하거나 말이 앞서 문제를 만들 수 있다. 의심도 과해질 수 있다.","확인되지 않은 정보를 퍼뜨리지 말고 추측 대신 직접 물어라.","말실수나 잘못 전달된 정보가 생기기 쉽다. 대상과 내용을 확인해라."]],"S12":[["결단과 속도가 필요한 상황이면 빠르게 결과를 움직일 수 있다. 너무 빠르면 조건을 놓친다.","핵심을 정했으면 실행하되 반론과 위험을 한 번 검토한 뒤 움직여라.","결정과 행동이 빨라진다. 미룬 일을 밀기 좋지만 말이 날카로워지지 않게 해라."],["성급한 판단과 공격적 행동이 결과를 망칠 수 있다. 방식 때문에 반발을 산다.","당장 결론내고 싶은 충동을 늦추고 사실과 상대 말을 확인한 뒤 행동해라.","마음이 급해 실수나 논쟁에 뛰어들기 쉽다. 평소보다 천천히 해라."]],"S13":[["감정에 휘둘리지 않고 사실을 보면 좋은 결과를 만들 수 있다. 명확한 기준이 강점이다.","필요한 선을 긋고 핵심을 직접 말해라. 친절하려고 사실을 흐리지 마라.","정리·판단·거절이 잘 된다. 복잡한 문제를 간단히 잘라내기 좋다."],["판단력이 냉소나 가혹함으로 변하면 결과가 나빠진다. 상처가 시야를 좁힐 수 있다.","사실을 말하되 벌주듯 말하지 마라. 화가 난 상태인지 확인해라.","예민한 말이 쉽게 나올 수 있다. 맞는 말도 표현을 부드럽게 다듬어라."]],"S14":[["논리와 전문성을 기준으로 결정하면 좋은 결과 가능성이 높다. 복잡한 문제를 구조화할 수 있다.","호불호보다 원칙과 데이터로 판단하고 결정 이유를 명확히 설명해라.","집중력과 판단력이 좋다. 문서·계획·결정에 유리하다."],["논리가 독단과 통제로 바뀌면 결과가 흔들린다. 내 결론에 맞는 정보만 볼 수 있다.","반대 의견을 일부러 찾아보고 지식으로 상대를 누르지 마라.","내가 옳다는 확신이 강해질 수 있다. 중요한 대화에서는 질문을 먼저 해라."]],"P01":[["돈·일·기술·건강처럼 현실 분야에서 좋은 기회가 들어온다. 작아도 실제 결과로 이어질 수 있다.","손에 잡히는 기회를 잡고 예산·일정·첫 작업 같은 현실적 첫 단계를 시작해라.","돈·일·생활에 실용적인 기회가 생기기 쉽다. 작은 이득을 놓치지 마라."],["기회를 놓치거나 준비 부족으로 현실화하지 못할 수 있다. 돈·시간 계획을 확인해라.","아이디어보다 실행 조건을 점검하고 부족한 예산·시간·기술을 채워라.","돈이나 일정에서 작은 실수가 생기기 쉽다. 결제·예약을 확인해라."]],"P02":[["여러 일을 동시에 다뤄도 균형을 유지하면 결과를 만들 수 있다. 핵심 마감은 놓치지 마라.","우선순위와 시간을 눈에 보이게 배분하고 가장 중요한 마감은 고정해라.","일정과 돈을 이리저리 맞춰야 하지만 유연하게 움직이면 잘 처리할 수 있다."],["너무 많은 일을 들고 있어 균형이 깨질 수 있다. 일정·비용·체력 중 하나가 한계다.","하나를 내려놓고 가장 중요한 두세 가지에 자원을 집중해라.","일정이 겹치거나 지출이 늘 수 있다. 우선순위를 다시 짜라."]],"P03":[["실력과 협업을 제대로 보여주면 좋은 결과가 난다. 역할을 맞추는 것이 중요하다.","피드백을 받고 전문성을 결과물로 보여줘라. 역할과 품질 기준을 합의해라.","함께 일하거나 배우는 과정에서 성과가 나기 좋다. 전문가 조언도 유용하다."],["협업 불일치나 기본 실력 부족이 결과를 흔들 수 있다. 역할이 애매하면 방해가 된다.","누가 무엇을 책임지는지 다시 정하고 모르는 것은 배우며 기준을 맞춰라.","팀워크가 답답하거나 피드백이 거슬릴 수 있다. 자존심보다 결과에 집중해라."]],"P04":[["가진 것을 지키는 데는 강하지만 확장에는 제한이 있다. 안정이 목표라면 괜찮다.","핵심 자원은 지키되 전부 움켜쥐지 말고 안전 범위에서 필요한 투자를 해라.","지출과 에너지를 아끼고 정리하기 좋다. 소유 문제에 과민해지지는 마라."],["붙잡던 것을 놓으면 흐름이 좋아질 수 있다. 반대로 통제 없는 지출이라면 손실을 조심해라.","무엇을 지키고 풀지 기준을 정해라. 불안해서 움켜쥔 것은 내려놓고 새는 비용은 막아라.","정리·기부·지출 조정에 좋다. 충동적으로 크게 쓰지만 마라."]],"P05":[["당장은 부족함이나 어려움이 있어 결과까지 가는 길이 힘들 수 있다. 도움 통로는 남아 있다.","체면 때문에 도움을 거절하지 말고 돈·정보·사람 중 이용 가능한 지원을 찾아라.","돈·체력·소속감에서 부족함을 느낄 수 있다. 필요한 도움을 요청해라."],["어려운 구간에서 벗어나기 시작한다. 지원을 받아들이면 결과가 점차 개선된다.","작은 수입·도움·치료·정보처럼 상황을 낫게 하는 자원을 적극적으로 써라.","막막했던 문제에 해결책이나 도움의 손길이 보일 수 있다."]],"P06":[["주고받는 균형이 맞으면 좋은 결과가 나기 쉽다. 필요한 지원을 받을 수도 있다.","도움은 구체적으로 요청하고 줄 때도 감당 가능한 범위와 공정한 조건을 정해라.","도움을 주거나 받을 일이 생기기 쉽다. 돈과 시간의 균형을 맞춰라."],["지원에 조건이 붙거나 주고받는 균형이 깨질 수 있다. 한쪽만 주는 구조는 오래 못 간다.","호의의 대가와 숨은 조건을 확인하고 불리한 약속이나 과한 퍼주기를 피하라.","돈이나 부탁에서 미묘한 불균형을 느낄 수 있다. 범위를 정해서 답해라."]],"P07":[["결과는 나올 수 있지만 시간이 필요하다. 지금은 수확 직전의 점검 단계다.","성과를 숫자와 사실로 평가해 효과 없는 부분만 수정하고 성장 중인 것은 기다려라.","진행 중인 일을 돌아보고 계속할 가치가 있는지 점검하기 좋은 날이다."],["기다린 만큼 성과가 없거나 잘못된 곳에 투자 중일 수 있다. 더 오래 한다고 해결되진 않는다.","매몰비용을 버리고 진척을 측정해 효과가 없으면 방법을 바꾸거나 중단해라.","기다림이 답답할 수 있다. 더 노력하기보다 힘을 잘못 쓰는 곳을 점검해라."]],"P08":[["꾸준히 기술을 갈고닦으면 좋은 결과 가능성이 높다. 반복과 숙련이 성과로 연결된다.","기본을 반복하고 결과물을 많이 만들며 작은 오류를 계속 고쳐라.","집중해서 일·공부하기 좋다. 반복 작업도 잘 풀리고 실력이 느는 날이다."],["반복은 하지만 품질이 늘지 않거나 대충 처리하고 있을 수 있다. 방식이 문제다.","무작정 많이 하지 말고 피드백을 받아 나쁜 습관을 고치고 기본부터 다시 잡아라.","집중이 깨져 실수가 반복될 수 있다. 중요한 작업은 검수 시간을 따로 둬라."]],"P09":[["스스로 쌓은 실력과 자원으로 만족스러운 결과를 얻을 가능성이 높다. 독립성이 강점이다.","남의 승인보다 내가 만든 기준을 믿고 성과를 유지할 돈·시간·환경을 관리해라.","혼자 보내는 시간도 만족스럽고 작은 성취를 즐기기 좋은 날이다."],["겉은 괜찮아도 비용이 크거나 자신감이 외부 평가에 의존할 수 있다.","보여주기 위한 소비와 실제 투자를 구분하고 혼자 다 하려 하지 마라.","돈·외모·성과를 남과 비교하기 쉽다. 과소비보다 가진 것을 잘 써라."]],"P10":[["장기적으로 안정적인 좋은 결과를 기대할 수 있다. 오래 남는 기반과 자산으로 이어질 가능성이 크다.","단기 이익보다 지속 가능한 구조를 택하고 기록·계약·시스템을 만들어라.","돈·집·가족·장기 계획을 정리하기 좋다. 안정적인 결정에 유리하다."],["장기 기반에 균열이 있거나 돈·가족·조직 문제가 결과를 흔들 수 있다.","공동 자금·계약·역할의 애매함을 없애고 오래됐다는 이유로 비효율을 유지하지 마라.","가족이나 돈에서 오래된 불편이 드러날 수 있다. 현실 조건을 정리해라."]],"P11":[["배우며 꾸준히 실행하면 현실적인 좋은 결과로 발전한다. 작은 기회가 기술과 성과가 된다.","공부만 하지 말고 과제·작업·저축처럼 눈에 보이는 형태로 만들어라.","공부·돈 관리·새 실무를 시작하기 좋다. 유용한 정보가 앞으로 도움이 된다."],["계획만 세우고 실행이 부족하거나 기본기를 건너뛰어 성과가 늦어질 수 있다.","새 계획보다 이미 정한 공부·저축·작업을 실제로 하고 작은 약속부터 지켜라.","집중이 흐트러져 실무를 미루기 쉽다. 오늘 할 양을 작게 정해 끝내라."]],"P12":[["느리지만 매우 안정적으로 결과를 만들 수 있다. 꾸준함이 필요한 일이라면 특히 좋다.","새 방법을 계속 찾기보다 검증된 루틴을 같은 품질로 반복해라.","크게 흥분할 일은 없어도 할 일을 차근차근 끝내기 좋다."],["정체와 반복에 빠져 성과가 늦을 수 있다. 변화가 필요한데 같은 방식만 고집할 수 있다.","루틴이 실제 결과를 만드는지 측정하고 효과 없는 반복은 바꿔라.","일이 지루하고 몸이 무거울 수 있다. 미룬 기본 업무 하나를 끝내라."]],"P13":[["현실 감각과 꾸준한 관리가 좋은 결과를 만든다. 자원을 안정적으로 돌보며 성과를 키운다.","성장시킬 것에 실제 자원을 배분하고 몸과 생활을 안정시켜 지속 가능하게 관리해라.","생활 정리·몸 돌보기·실용적인 일 처리에 좋다. 작은 관리가 안정감을 준다."],["남을 챙기느라 내 자원이 고갈되거나 돈과 생활 관리가 흐트러질 수 있다.","내 체력·시간·재정을 먼저 확인하고 감당 못 할 돌봄은 줄여라.","집안일과 사람 챙기기가 부담스러울 수 있다. 내 생활부터 정돈해라."]],"P14":[["현실적인 성공 가능성이 매우 높다. 장기 계획과 자원 관리가 결과를 만들 수준에 가깝다.","숫자와 구조를 보고 결정해라. 단기 이익보다 오래 유지할 선택을 해라.","돈과 일에서 안정적인 판단을 하기 좋다. 예산·계약·장기 계획 검토에 유리하다."],["돈이나 성과를 통제하려는 욕심이 커지면 결과가 나빠질 수 있다. 이익만 보면 신뢰를 잃는다.","돈을 수단으로 보고 독점·무리한 확장을 피하며 손실 가능성과 사람의 비용까지 계산해라.","돈과 통제 문제에 예민할 수 있다. 큰 구매나 강한 지시는 한 번 더 검토해라."]]};
function applyReading(c,rev){
 const d=fixedQuestionReadings[c.id][rev?1:0];
 return [
  ["1. 이거 잘 될까?",d[0]],
  ["2. 어떻게 하는 게 좋을까?",d[1]],
  ["3. 오늘의 운세는?",d[2]]
 ];
}

function memory(c){if(c.family==="Major"){const m={M00:"절벽 앞의 첫걸음 = 가능성",M01:"도구는 이미 탁자 위에 = 실행",M02:"장막 뒤의 지식 = 직관",M03:"풍성한 정원 = 키우는 힘",M04:"돌 왕좌 = 구조와 책임",M05:"스승과 제자 = 전통에서 배움",M06:"사랑보다 먼저 가치의 선택",M07:"두 힘을 한 방향으로 = 전진",M08:"사자를 부드럽게 다룸 = 진짜 힘",M09:"등불 하나로 길을 찾음 = 성찰",M10:"도는 바퀴 = 국면과 타이밍",M11:"저울과 검 = 균형 잡힌 판단",M12:"거꾸로 보면 다르게 보인다",M13:"끝이 있어야 다음이 시작된다",M14:"두 컵의 물을 섞음 = 조절",M15:"사슬을 알아차려야 벗어난다",M16:"번개 맞은 탑 = 거짓 구조의 붕괴",M17:"어둠 뒤 별빛 = 회복",M18:"달빛 길 = 불확실 속 직감",M19:"대낮의 태양 = 명료한 기쁨",M20:"나팔을 듣고 일어남 = 각성과 결단",M21:"월계환 = 한 주기의 완성"};return m[c.id]}return `${c.family==="Wands"?"불·행동":c.family==="Cups"?"물·감정":c.family==="Swords"?"공기·생각":"땅·현실"} + ${rankLesson[rank(c)].split("다.")[0]} = ${c.ko}`}
const $=id=>document.getElementById(id);let prefs={reversed:false};try{prefs.reversed=!!JSON.parse(localStorage.getItem(PREF_KEY)||"{}").reversed}catch(e){}
function syncReverseUI(){const cb=$("t-reversed"),btn=$("t-reverseToggle");if(!cb||!btn)return;cb.checked=!!prefs.reversed;btn.classList.toggle("active",!!prefs.reversed);btn.setAttribute("aria-pressed",prefs.reversed?"true":"false");btn.title=prefs.reversed?"역방향 포함 켜짐 · 다시 누르면 해제":"역방향 포함 꺼짐 · 누르면 활성화"}
function savePrefs(){const cb=$("t-reversed");if(cb)cb.checked=!!prefs.reversed;localStorage.setItem(PREF_KEY,JSON.stringify(prefs));syncReverseUI()}
syncReverseUI();$("t-reverseToggle").addEventListener("click",()=>{prefs.reversed=!prefs.reversed;savePrefs()});
function randomInt(max){if(!Number.isInteger(max)||max<=0)throw new RangeError("max must be a positive integer");if(window.crypto&&crypto.getRandomValues){const range=0x100000000,limit=range-(range%max),a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
let session=[];
function showCard(c,rev){$("t-card").classList.remove("back");$("t-image").hidden=false;$("t-image").src=imageUrl(c);$("t-image").alt=c.ko+" 카드";$("t-image").classList.toggle("reversed",rev);$("t-cardContent").hidden=false;$("t-type").textContent=c.family==="Major"?"MAJOR ARCANA":c.family.toUpperCase();$("t-name").textContent=`${c.ko} · ${c.en}`;$("t-dir").textContent=rev?"역방향":"정방향";$("t-keywords").textContent=c.keywords;$("t-core").textContent=core(c);$("t-symbol").textContent=symbol(c);$("t-meaningLabel").textContent=rev?"역방향 해석":"정방향 해석";$("t-meaning").textContent=rev?reversed(c):upright(c);$("t-readingPoint").textContent=readingPoint(c,rev);$("t-memory").textContent=memory(c);const app=applyReading(c,rev);$("t-apply").innerHTML=app.map(x=>`<div class="tarot-apply-item"><b>${x[0]}</b><br>${x[1]}</div>`).join("")}
function renderSession(){const box=$("t-session");if(!box)return;box.classList.toggle("show",session.length>1);box.innerHTML=session.length>1?session.map((x,i)=>`<div class="tarot-session-card"><img src="${imageUrl(x.card)}" class="${x.rev?"rev":""}" alt="${x.card.ko}"><span>${i+1}장 · ${x.card.ko}</span></div>`).join(""):""}
function pickFrom(pool){const c=pool[randomInt(pool.length)],rev=!!prefs.reversed&&randomInt(2)===1;return {card:c,rev}}
function draw(){session=[pickFrom(cards)];showCard(session[0].card,session[0].rev);renderSession()}
function drawNext(){const used=new Set(session.map(x=>x.card.id)),pool=cards.filter(c=>!used.has(c.id));if(!session.length)return draw();if(!pool.length)return;const x=pickFrom(pool);session.push(x);showCard(x.card,x.rev);renderSession()}
$("t-draw").onclick=draw;$("t-next").onclick=drawNext;
function guideCard(c){return `<article class="guide-card" data-family="${c.family}"><img loading="lazy" src="${imageUrl(c)}" alt="${c.ko}"><div><h5>${c.ko} · ${c.en}</h5><p><b>핵심</b> ${c.keywords}</p><p><b>정방향</b> ${upright(c)}</p><p><b>역방향</b> ${reversed(c)}</p><p><b>기억</b> ${memory(c)}</p></div></article>`}
function renderGuide(filter="All"){const list=filter==="All"?cards:cards.filter(c=>c.family===filter);$("t-guideCards").innerHTML=list.map(guideCard).join("");document.querySelectorAll("#t-module .guide-filter button").forEach(b=>b.classList.toggle("active",b.dataset.f===filter))}
function buildGuide(){if($("t-guideBody").dataset.ready)return;$("t-guideBody").dataset.ready="1";$("t-guideBody").innerHTML=`<div class="guide-intro"><div class="guide-section"><h4>카드를 읽는 순서</h4><ol><li>그림에서 가장 먼저 눈에 들어오는 인물·색·방향을 본다.</li><li>메이저인지, 마이너라면 수트와 숫자/궁정 계급을 확인한다.</li><li>키워드를 외우기보다 그림 → 수트 → 숫자 → 질문 순서로 의미를 좁힌다.</li><li>역방향은 단순한 반대가 아니라 막힘·과잉·부족·내면화·지연으로 본다.</li></ol></div><div class="guide-section"><h4>4개 수트</h4><p><b>완드 = 불</b> · 행동, 열정, 창조<br><b>컵 = 물</b> · 감정, 관계, 직관<br><b>소드 = 공기</b> · 생각, 말, 판단, 갈등<br><b>펜타클 = 땅</b> · 돈, 일, 몸, 생활</p></div><div class="guide-section"><h4>숫자와 궁정카드</h4><p>에이스 시작 · 2 균형/선택 · 3 확장 · 4 안정 · 5 흔들림 · 6 조정 · 7 시험 · 8 움직임/숙련 · 9 성숙 · 10 완성. 시종은 배우는 자, 기사는 행동하는 자, 여왕은 내면의 숙련, 왕은 외부의 운영으로 잡으면 외우기 쉽다.</p></div><div class="guide-section"><h4>1장과 3장 리딩</h4><p><b>1장</b>은 질문의 핵심 초점 하나를 깊게 읽는다. <b>3장</b>은 먼저 자리의 뜻을 정한다. 예: 과거-현재-미래 / 상황-장애물-조언 / 나-상대-관계. 각 장을 따로 해석한 뒤 ① 같은 수트가 반복되는지 ② 메이저가 어디에 있는지 ③ 숫자가 증가/감소하는지 ④ 인물의 시선과 카드의 분위기가 어디로 흐르는지 연결한다. 마지막에는 세 장을 한 문장으로 요약한다.</p></div></div><div class="guide-filter"><button data-f="All">전체 78</button><button data-f="Major">메이저</button><button data-f="Wands">완드</button><button data-f="Cups">컵</button><button data-f="Swords">소드</button><button data-f="Pentacles">펜타클</button></div><div class="guide-cards" id="t-guideCards"></div>`;document.querySelectorAll("#t-module .guide-filter button").forEach(b=>b.onclick=()=>renderGuide(b.dataset.f));renderGuide()}
function openGuide(){const back=$("t-guideBack");if(!back)return;try{buildGuide()}catch(err){console.error("Tarot guide error",err);$("t-guideBody").innerHTML=`<div class="guide-section"><h4>가이드북을 불러오지 못했습니다.</h4><p>페이지를 새로고침한 뒤 다시 눌러주세요.</p></div>`}back.classList.add("open");back.style.display="flex";back.setAttribute("aria-hidden","false");document.documentElement.style.overflow="hidden"}
function closeGuide(){const back=$("t-guideBack");if(!back)return;back.classList.remove("open");back.style.display="none";back.setAttribute("aria-hidden","true");document.documentElement.style.overflow=""}
window.openTarotGuide=openGuide;window.closeTarotGuide=closeGuide;const helpBtn=$("t-help"),closeBtn=$("t-guideClose"),guideBack=$("t-guideBack");if(helpBtn)helpBtn.onclick=openGuide;if(closeBtn)closeBtn.onclick=closeGuide;if(guideBack)guideBack.onclick=e=>{if(e.target===guideBack)closeGuide()};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&guideBack&&guideBack.classList.contains("open"))closeGuide()});
window.randomTarotBridge={exportData:()=>({reversed:!!prefs.reversed}),importData:x=>{prefs.reversed=!!(x&&x.reversed);savePrefs()},resetData:()=>{prefs.reversed=false;savePrefs()}};
})();
</script>

</body></html>
