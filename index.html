:root{--bg:#eee6d8;--line:#d8c9b4;--text:#2b241d;--accent:#6d4935}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.random-shell{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr)}.random-nav{background:#fffaf1;border-bottom:1px solid var(--line);padding:max(7px,env(safe-area-inset-top)) 10px 7px;z-index:10}
.random-row{max-width:1440px;margin:auto;display:flex;align-items:center;gap:12px}.random-brand{display:flex;align-items:center;gap:7px;font-weight:950;color:var(--text);white-space:nowrap}

.random-tabs{margin-left:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:min(520px,100%)}.random-tab{border:1px solid var(--line);border-radius:10px;background:#f7efdf;color:var(--text);padding:8px 11px;font:inherit;font-size:12px;font-weight:850;cursor:pointer}
.random-tab.active{background:var(--accent);border-color:var(--accent);color:#fffaf2}.random-stage{position:relative;min-height:0}.random-frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}.random-frame.active{display:block}
@media(max-width:560px){.random-row{display:block}.random-brand{justify-content:center;height:28px;font-size:13px}.random-dice{width:24px;height:24px;font-size:13px}.random-tabs{width:100%;margin:4px 0 0;gap:5px}.random-tab{padding:7px 4px}}

const urls={};
function decode64(s){return new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0)))}
function ensureLoaded(n){if(urls[n])return;const u=URL.createObjectURL(new Blob([decode64(EMBEDDED[n])],{type:"text/html;charset=utf-8"}));urls[n]=u;document.getElementById("random-"+n).src=u}
function openTool(n){ensureLoaded(n);document.querySelectorAll(".random-tab").forEach(x=>x.classList.toggle("active",x.dataset.tool===n));document.querySelectorAll(".random-frame").forEach(x=>x.classList.toggle("active",x.id==="random-"+n))}
document.querySelectorAll(".random-tab").forEach(x=>x.onclick=()=>openTool(x.dataset.tool));ensureLoaded("concept");
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
