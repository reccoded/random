먼저 이 재료들에서 누구나 쉽게 떠올릴 만한 전형적인 이야기, 관계, 갈등, 장르적 진행을 내부적으로 판단하고, 실제 답변에서는 가능한 한 그것들을 피해서 다른 방향을 찾아라. 그 판단 과정이나 피한 클리셰 목록은 출력하지 마라.

의외성을 만들기 위해 무조건 기괴하거나 비현실적인 설정을 추가할 필요는 없다. 평범한 현실 안에서도 인물의 역할을 바꾸거나, 예상되는 관계를 다른 방향으로 연결하거나, 사건의 중심을 옮기거나, 보통 조연이 될 사람을 중심인물로 삼거나, 원인과 결과의 관계를 다르게 만드는 방식으로 낯설게 만들 수 있다.

새로운 설정을 계속 발명해서 의외성을 만드는 것보다, 먼저 이미 주어진 재료들 사이의 관계를 새롭게 해석해라. 서로 당연히 연결될 것 같은 재료를 일부러 떨어뜨려 보거나, 별 관계없어 보이는 두 재료를 중심적으로 연결하거나, 같은 재료를 예상과 다른 역할로 사용하는 방법을 찾아라.

주어진 재료는 이야기의 출발점이며 전부 사용할 필요는 없다. 일부 재료를 약하게 사용하거나 제외하거나 필요한 경우 새로운 인물과 상황을 추가해도 된다. 하지만 의외성을 만들기 위해 핵심 재료의 의미를 단순히 정반대로 뒤집지는 마라.

예를 들어 ‘비밀을 끝까지 숨기고 싶다’는 욕망을 ‘사실은 들키고 싶다’로 바꾸는 식으로 재료 자체를 반대로 만드는 것보다, 원래의 욕망과 상황을 유지한 채 그것들이 예상하지 못한 인물, 사건, 관계와 충돌하도록 만들어라.

인물의 역할을 뒤집는 것도 적극적으로 시도해라. 비밀을 폭로할 것 같은 사람이 오히려 비밀을 지켜주거나, 도움을 줄 것 같은 사람이 의도하지 않게 문제를 키우거나, 주인공이 두려워하던 사람이 실제로는 아무것도 모르거나, 예상했던 적과 동료의 위치가 달라지는 식의 변화도 가능하다.

하지만 모든 컨셉을 반전 구조로 만들 필요는 없다. 의외성은 충격적인 반전보다 이야기의 출발점이나 연결 방식에서 느껴지는 것이 더 중요하다.

반전을 위한 반전, 억지스러운 충격, 설명을 많이 붙여야만 성립하는 기괴한 설정은 피한다. 결과를 읽었을 때 “이 재료로 그런 방향으로도 갈 수 있겠네”라는 느낌이 드는 아이디어를 우선해라.

각 컨셉은 왜 의외인지 분석하거나 설명하지 말고 바로 이야기 자체를 써라. 한두 문장으로 충분하면 거기서 끝내고, 이야기를 조금 더 보여줘야 매력이 살아나는 경우에만 몇 문장 정도로 확장해라. 이야기보다 상황이나 설정 자체가 강하다면 그것만 짧게 제시해도 된다.

각 컨셉은 서로 다른 방식으로 재료를 비틀어라. 같은 종류의 역할 뒤집기나 같은 반전 구조를 반복하면서 인물이나 장소만 바꾸지 마라.

개수를 미리 정하지 마라. 좋은 아이디어가 2~3개뿐이라면 거기서 끝내고, 서로 다른 좋은 아이디어가 더 있다면 더 제안해도 된다. 숫자를 채우기 위해 억지스럽거나 비슷한 아이디어를 추가하지 마라.

무엇보다 재료를 무시해서 의외로워지는 것이 아니라, 주어진 재료를 보고도 쉽게 예상하지 못했던 연결을 발견하는 것을 우선해라.`}
];

let data=loadData(), prompts=loadPrompts(), current=null, recent=[], selectedKeys=new Set();

function clone(v){return JSON.parse(JSON.stringify(v))}
function loadData(){
 try{const x=JSON.parse(localStorage.getItem("conceptData")); if(x&&typeof x==="object")return x}catch(e){}
 try{const old=JSON.parse(localStorage.getItem("conceptMixerData")); if(old&&old.protagonist)return old}catch(e){}
 return clone(BASE_DATA)
}
function loadPrompts(){
 try{const x=JSON.parse(localStorage.getItem("conceptPrompts")); if(Array.isArray(x))return x}catch(e){}
 return clone(DEFAULT_PROMPTS)
}
function saveData(){localStorage.setItem("conceptData",JSON.stringify(data))}
function savePrompts(){localStorage.setItem("conceptPrompts",JSON.stringify(prompts))}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function similarity(a,b){
 if(!a||!b)return 0; const A=new Set(a.split(/\s+/)),B=new Set(b.split(/\s+/)); let n=0;
 A.forEach(x=>{if(B.has(x))n++}); return n/Math.max(1,Math.min(A.size,B.size))
}
function weightedPick(cat,used=[]){
 const arr=data[cat]||[]; if(!arr.length)return "";
 let pool=arr.filter(x=>!used.includes(x)); if(!pool.length)pool=arr;
 const recentText=recent.join(" ");
 const scored=pool.map(v=>{
   let w=1;
   if(cat==="protagonist"&&/형사|경찰|변호사|기자/.test(recentText)&&/형사|경찰|변호사|기자/.test(v))w*=.35;
   if(cat==="genre"&&/범죄|스릴러|미스터리|공포|서스펜스/.test(recentText)&&/범죄|스릴러|미스터리|공포|서스펜스/.test(v))w*=.45;
   if(["protagonist","desire","setting"].includes(cat))w*=1.1;
   for(const r of recent)w*=Math.max(.35,1-similarity(v,r)*.55);
   return {v,w}
 });
 let r=Math.random()*scored.reduce((s,x)=>s+x.w,0);
 for(const x of scored){r-=x.w;if(r<=0)return x.v}
 return scored[0]?.v||""
}
function chooseGenre(){return weightedPick("genre")}
function makeCore(){
 const out={},used=[];
 REQUIRED.forEach(c=>{out[c]=c==="genre"?chooseGenre():weightedPick(c,used);if(out[c])used.push(out[c])});
 const count=Math.floor(3+Math.random()*5);
 const candidates=OPTIONAL.filter(c=>!REQUIRED.includes(c)).sort(()=>Math.random()-.5);
 for(const c of candidates.slice(0,count)){const v=weightedPick(c,used);if(v){out[c]=v;used.push(v)}}
 recent=[...Object.entries(out).filter(([k,v])=>LABELS[k]&&v).map(x=>x[1]),...recent].slice(0,22);
 return out
}
function renderEmpty(){
 const top=document.getElementById("c-selectionTop"); if(top)top.classList.add("hidden");
 const el=document.getElementById("c-results");el.className="empty";
 el.innerHTML=`<h2>조합</h2><p>새 조합을 눌러 시작하세요.</p>`;
 document.getElementById("c-feedback").classList.add("hidden")
}
function generate(){current=makeCore();selectedKeys=new Set(Object.keys(current).filter(k=>LABELS[k]&&current[k]));c_render()}
function c_render(){
 const el=document.getElementById("c-results");el.className="c-results";
 const keys=Object.keys(current).filter(k=>LABELS[k]&&current[k]);
 el.innerHTML=keys.map(k=>{
   const on=selectedKeys.has(k);
   return `<div class="card selectable ${on?"":"excluded"}" onclick="toggleCard('${k}')">
     <div class="label">${LABELS[k][0]} ${LABELS[k][1]}</div>
     <div class="value">${esc(current[k])}</div>
     <button class="swap" title="이 항목만 바꾸기" onclick="event.stopPropagation();swapOne('${k}')">↻</button>
     ${on?"":`<div class="excludeMark">발전에서 제외</div>`}
   </div>`
 }).join("");
 const top=document.getElementById("c-selectionTop");
 top.classList.remove("hidden");
 document.getElementById("c-selectionCount").textContent=`${selectedKeys.size}/${keys.length}`;
 const allToggle=document.getElementById("c-selectAllToggle");
 const allSelected=keys.length>0&&selectedKeys.size===keys.length;
 if(allToggle){allToggle.classList.toggle("active",allSelected);allToggle.setAttribute("aria-pressed",String(allSelected));}
 const fb=document.getElementById("c-feedback");fb.classList.remove("hidden");
 fb.innerHTML=`<button class="btn" onclick="saveCurrent()">즐겨찾기 추가</button><button class="btn primary" onclick="openPrompt()">발전시키기</button>`
}
function toggleCard(k){if(selectedKeys.has(k))selectedKeys.delete(k);else selectedKeys.add(k);c_render()}
function selectAll(){if(!current)return;selectedKeys=new Set(Object.keys(current).filter(k=>LABELS[k]&&current[k]));c_render()}
function clearSelection(){selectedKeys.clear();c_render()}
function toggleSelectAll(){if(!current)return;const keys=Object.keys(current).filter(k=>LABELS[k]&&current[k]);if(keys.length&&selectedKeys.size===keys.length)clearSelection();else selectAll()}
function swapOne(k){
 if(!current||!data[k]||!data[k].length)return;
 const used=Object.entries(current).filter(([key])=>key!==k&&LABELS[key]).map(x=>x[1]);
 current[k]=k==="genre"?chooseGenre():weightedPick(k,used); c_render()
}
function saveCurrent(){
 if(!current)return; const list=JSON.parse(localStorage.getItem("conceptFavorites")||localStorage.getItem("conceptMixerSaved")||"[]");
 list.unshift({id:Date.now(),date:new Date().toLocaleString("ko-KR"),combo:clone(current),memo:""});
 localStorage.setItem("conceptFavorites",JSON.stringify(list));alert("즐겨찾기에 저장했습니다.")
}
function openSaved(){
 const list=JSON.parse(localStorage.getItem("conceptFavorites")||localStorage.getItem("conceptMixerSaved")||"[]");
 showModal(`<div class="modalhead"><div><h2>즐겨찾기</h2></div><button class="iconbtn" onclick="c_closeModal()">✕</button></div>
 <div class="savedlist">${list.length?list.map(x=>`<div class="saved"><div class="savedhead"><b>💡 조합 · ${esc(x.date)}</b>
 <div class="smallactions"><button onclick="loadSaved(${x.id})">불러오기</button><button class="danger" onclick="deleteSaved(${x.id})">삭제</button></div></div>
 <pre>${esc(Object.entries(x.combo).filter(([k])=>LABELS[k]).map(([k,v])=>`${LABELS[k][0]} ${LABELS[k][1]} — ${v}`).join("\n"))}</pre>
 <input style="width:100%;margin-top:8px;padding:9px;border:1px solid var(--line);border-radius:9px;background:#fffdf8;color:var(--text)" placeholder="메모" value="${esc(x.memo||"")}" onchange="memoSaved(${x.id},this.value)"></div>`).join(""):`<div class="empty">아직 즐겨찾기가 없습니다.</div>`}</div>
 <div class="modalfoot"><span></span><button class="btn danger" onclick="deleteAllSaved()">즐겨찾기 전체 삭제</button></div>`)
}
function getFavorites(){return JSON.parse(localStorage.getItem("conceptFavorites")||localStorage.getItem("conceptMixerSaved")||"[]")}
function setFavorites(x){localStorage.setItem("conceptFavorites",JSON.stringify(x))}
function loadSaved(id){const x=getFavorites().find(a=>a.id===id);if(!x)return;current=clone(x.combo);if(current&&"core" in current)delete current.core;selectedKeys=new Set(Object.keys(current).filter(k=>LABELS[k]&&current[k]));c_render();c_closeModal()}
function deleteSaved(id){setFavorites(getFavorites().filter(x=>x.id!==id));openSaved()}
function memoSaved(id,v){const list=getFavorites(),x=list.find(a=>a.id===id);if(x)x.memo=v;setFavorites(list)}
function deleteAllSaved(){if(!confirm("즐겨찾기를 모두 삭제할까요? 이 작업은 되돌릴 수 없습니다."))return;setFavorites([]);openSaved()}

function buildComboLines(){
 if(!current)return "";
 return Object.entries(current).filter(([k,v])=>LABELS[k]&&v&&selectedKeys.has(k)).map(([k,v])=>`${LABELS[k][1]}: ${v}`).join("\n")
}
function applyPrompt(t){
 return t.replaceAll("{{조합}}",buildComboLines()||"(선택된 재료 없음)")
}
function openPrompt(){
 if(!current)return;if(!prompts.length)return alert("프롬프트 프리셋이 없습니다. 설정에서 프롬프트를 추가해주세요.");
 if(!selectedKeys.size&&!confirm("선택된 재료가 없습니다. 그래도 발전시키기를 열까요?"))return;
 const p=prompts[0];
 showModal(`<div class="modalhead"><div><h2>발전시키기</h2></div><button class="iconbtn" onclick="c_closeModal()">✕</button></div>
 <div class="promptToolbar"><select id="promptPreset" onchange="changePromptPreview(this.value)">${prompts.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join("")}</select>
 <button class="btn" onclick="openPromptManager()">프롬프트 관리</button></div>
 <textarea id="promptPreview" class="promptbox">${esc(applyPrompt(p.text))}</textarea>
 <div class="copy-status" id="copyStatus"></div>
 <div class="modalfoot"><span class="muted">이 창의 내용도 복사 전에 자유롭게 수정할 수 있습니다.</span><button class="btn primary" onclick="copyPrompt()">복사</button></div>`)
}
function changePromptPreview(id){const p=prompts.find(x=>x.id===id);if(p)document.getElementById("promptPreview").value=applyPrompt(p.text)}
async function copyPrompt(){
 const box=document.getElementById("promptPreview"),status=document.getElementById("copyStatus");if(!box)return;
 try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(box.value);else{box.focus();box.select();document.execCommand("copy")}
 status.className="copy-status success";status.textContent="✓ 클립보드에 복사했습니다."}catch(e){status.className="copy-status error";status.textContent="복사에 실패했습니다. 직접 선택해서 복사해주세요."}
}
function openPromptManager(){
 showModal(`<div class="modalhead"><div><h2>프롬프트 관리</h2><div class="muted">{{조합}} 자리표시자를 사용할 수 있습니다.</div></div><button class="iconbtn" onclick="c_closeModal()">✕</button></div>
 <div class="savedlist">${prompts.length?prompts.map((p,i)=>`<div class="saved"><div class="savedhead"><b>${esc(p.name)}</b><div class="smallactions"><button onclick="editPrompt(${i})">수정</button><button class="danger" onclick="removePrompt(${i})">삭제</button></div></div><pre>${esc(p.text)}</pre></div>`).join(""):`<div class="empty">프롬프트가 없습니다.</div>`}</div>
 <div class="modalfoot"><button class="btn primary" onclick="editPrompt(-1)">프롬프트 추가</button><button class="btn" onclick="openSettings()">설정으로</button></div>`)
}
function editPrompt(i){
 const p=i>=0?prompts[i]:{name:"",text:"{{조합}}"};
 showModal(`<div class="modalhead"><div><h2>${i>=0?"프롬프트 수정":"프롬프트 추가"}</h2></div><button class="iconbtn" onclick="c_closeModal()">✕</button></div>
 <div class="field"><label>프리셋 이름</label><input id="promptName" value="${esc(p.name)}"></div>
 <div class="field"><label>프롬프트</label><textarea id="promptText">${esc(p.text)}</textarea></div>
 <div class="modalfoot"><button class="btn" onclick="openPromptManager()">취소</button><button class="btn primary" onclick="savePromptItem(${i})">저장</button></div>`)
}
function savePromptItem(i){const name=document.getElementById("promptName").value.trim(),text=document.getElementById("promptText").value.trim();if(!name||!text)return alert("이름과 프롬프트를 입력해주세요.");const item={id:i>=0?prompts[i].id:"p"+Date.now(),name,text};if(i>=0)prompts[i]=item;else prompts.push(item);savePrompts();openPromptManager()}
function removePrompt(i){if(!confirm("이 프롬프트를 삭제할까요?"))return;prompts.splice(i,1);savePrompts();openPromptManager()}

function openSettings(){
 showModal(`<div class="modalhead"><div><h2>설정</h2></div><button class="iconbtn" onclick="c_closeModal()">✕</button></div>
 <div class="settingsGrid concept-settings-main">
  <div class="settingCard"><h3>소재 데이터</h3><div class="muted">주인공, 욕망, 상황, 관계 등 조합 재료를 관리합니다.</div><div class="actions"><button class="btn" onclick="openData()">데이터 관리</button></div></div>
  <div class="settingCard"><h3>프롬프트</h3><div class="muted">발전시키기에 사용할 프리셋을 추가·수정·삭제합니다.</div><div class="actions"><button class="btn" onclick="openPromptManager()">프롬프트 관리</button></div></div>
  <div class="settingCard"><h3>통합 백업</h3><div class="muted">CONCEPT · Q&amp;A · SELECT · TAROT 설정을 하나의 JSON으로 저장하거나 복원합니다.</div><div class="actions"><button class="btn" onclick="exportUnifiedData()">통합 내보내기</button><button class="btn" onclick="importUnifiedData()">통합 가져오기</button></div></div>
  <div class="settingCard"><h3>초기화</h3><div class="muted">CONCEPT · Q&amp;A · SELECT 데이터와 TAROT 설정을 한 번에 초기화합니다.</div><div class="actions"><button class="btn danger" onclick="resetUnifiedData()">통합 데이터 초기화</button><button class="btn" onclick="restoreDefaults()">CONCEPT 기본값 복원</button></div></div>
 </div>`)
}
function openData(){const cats=Object.keys(LABELS).filter(k=>Array.isArray(data[k]));showModal(`<div id="dataModal"></div>`);renderDataModal(cats[0]||"protagonist")}
function renderDataModal(active){
 const cats=Object.keys(LABELS).filter(k=>Array.isArray(data[k])),q=window._dataSearch||"";
 const arr=Array.isArray(data[active])?data[active]:[];
 document.getElementById("dataModal").innerHTML=`<div class="modalhead"><div><h2>데이터 관리</h2></div><button class="iconbtn" onclick="c_closeModal()">✕</button></div>
 <div class="tabs">${cats.map(k=>`<button class="tab ${k===active?"active":""}" onclick="renderDataModal('${k}')">${LABELS[k][0]} ${LABELS[k][1]} <span class="muted">${data[k].length}</span></button>`).join("")}</div>
 <div class="searchrow"><input placeholder="데이터 검색" value="${esc(q)}" oninput="window._dataSearch=this.value;renderDataModal('${active}')"><button class="btn primary" onclick="editData('${active}',-1)">추가</button></div>
 <div>${arr.map((v,i)=>({v,i})).filter(x=>!q||x.v.toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="dataitem"><span>${esc(x.v)}</span><div class="smallactions"><button onclick="editData('${active}',${x.i})">수정</button><button class="danger" onclick="removeData('${active}',${x.i})">삭제</button></div></div>`).join("")||`<div class="empty">검색 결과가 없습니다.</div>`}</div>
 <div class="modalfoot"><button class="btn" onclick="openSettings()">설정으로</button></div>`
}

function importUnifiedData(){
 const input=document.createElement("input");input.type="file";input.accept=".json,application/json";
 input.onchange=e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{
   const x=JSON.parse(String(r.result??"").replace(/^\uFEFF/,"").trim());
   if(!x||x.app!=="RANDOM"||!x.concept||!x.qa||!x.select)throw new Error("invalid");
   if(!x.concept.data||!Array.isArray(x.concept.prompts)||!Array.isArray(x.concept.favorites))throw new Error("concept");
   if(!Array.isArray(x.qa.categories)||!Array.isArray(x.qa.questions)||!Array.isArray(x.qa.favorites))throw new Error("qa");
   if(!Array.isArray(x.select.sets)||!x.select.sets.length)throw new Error("select");
   if(!confirm("현재 CONCEPT · Q&A · SELECT 데이터와 TAROT 설정을 백업 파일 내용으로 교체할까요?"))return;
   data=x.concept.data;prompts=x.concept.prompts;setFavorites(x.concept.favorites);saveData();savePrompts();current=null;selectedKeys.clear();renderEmpty();
   categories=x.qa.categories;questions=x.qa.questions;favorites=new Set(x.qa.favorites);currentQuestionId=null;questionMode="normal";selectedCategories.clear();q_save();updateNav();
   window.randomSelectBridge.importData(x.select);
   if(window.randomTarotBridge)window.randomTarotBridge.importData(x.tarot||{reversed:false});
   alert("CONCEPT · Q&A · SELECT · TAROT 통합 백업을 가져왔습니다.");openSettings();
  }catch(err){console.error("RANDOM unified import error",err);alert("RANDOM 통합 백업 JSON 파일 형식을 확인해 주세요.");}};
  r.onerror=()=>alert("파일을 읽는 중 오류가 발생했습니다.");r.readAsText(f,"utf-8");};input.click();
}

function importData(){
 const input=document.createElement("input");
 input.type="file";input.accept=".json,application/json";
 input.onchange=e=>{
   const f=e.target.files&&e.target.files[0];if(!f)return;
   const r=new FileReader();
   r.onload=()=>{
     let x;
     try{
       let text=String(r.result??"").replace(/^\uFEFF/,"").trim();
       x=JSON.parse(text);
     }catch(err){
       alert("JSON 파일을 읽을 수 없습니다. 파일 형식을 확인해 주세요.");
       return;
     }
     try{
       // Current CONCEPT backup: {app, version, data, prompts}
       if(x&&x.data&&typeof x.data==="object"&&!Array.isArray(x.data)){
         data=x.data;
         if(Array.isArray(x.prompts)) prompts=x.prompts;
         else if(!Array.isArray(prompts)||!prompts.length) prompts=clone(DEFAULT_PROMPTS);
       }
       // Older/raw CONCEPT data JSON
       else if(x&&typeof x==="object"&&!Array.isArray(x)&&(
         x.protagonist||x.desire||x.situation||x.relationship||x.setting||x.genre
       )){
         data=x;
         if(!Array.isArray(prompts)||!prompts.length) prompts=clone(DEFAULT_PROMPTS);
       }
       else{
         alert("CONCEPT 데이터 형식을 확인할 수 없습니다.");
         return;
       }
       saveData();
       savePrompts();
       alert("데이터를 가져왔습니다.");
       openSettings();
     }catch(err){
       console.error("CONCEPT import apply error",err);
       alert("JSON은 읽었지만 데이터를 적용하는 중 오류가 발생했습니다.");
     }
   };
   r.onerror=()=>alert("파일을 읽는 중 오류가 발생했습니다.");
   r.readAsText(f,"utf-8");
 };
 input.click();
}

const LS_Q="onit_questions_v1";
const LS_C="onit_categories_v1";
const LS_F="onit_favorites_v1";

let categories = loadCategories();
let questions = loadQuestions();
let favorites = new Set(JSON.parse(localStorage.getItem(LS_F)||"[]"));
let currentQuestionId = null;
let currentView = "random";
let questionMode = "normal"; // normal | favorites
let selectedCategories = new Set(); // 비어 있으면 전체 질문

function loadCategories(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_C));
    return Array.isArray(saved)&&saved.length ? saved : structuredClone(DEFAULT_CATEGORIES);
  }catch(e){return structuredClone(DEFAULT_CATEGORIES)}
}
function loadQuestions(){
  try{
    const saved=JSON.parse(localStorage.getItem(LS_Q));
    return Array.isArray(saved)&&saved.length ? saved : QUESTIONS;
  }catch(e){return QUESTIONS}
}
function q_save(){
  localStorage.setItem(LS_Q,JSON.stringify(questions));
  localStorage.setItem(LS_C,JSON.stringify(categories));
  localStorage.setItem(LS_F,JSON.stringify([...favorites]));
}
function catName(id){return categories.find(c=>c.id===id)?.name || "미분류"}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function randomFrom(arr){return arr.length?arr[Math.floor(Math.random()*arr.length)]:null}
function toast(msg){
  const el=document.getElementById("q-toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove("show"),1800);
}
function updateNav(){
  document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.view===currentView));
  document.querySelectorAll("[data-mobile-view]").forEach(b=>b.classList.toggle("active",b.dataset.mobileView===currentView));
  document.getElementById("q-favCountNav").textContent=favorites.size?`(${favorites.size})`:"";
  const mobileCount=document.getElementById("q-favCountMobile");
  if(mobileCount) mobileCount.textContent=favorites.size?`(${favorites.size})`:"";
}
function setView(v){
  currentView=v;
  if(v==="random") questionMode="normal";
  updateNav();
  if(v==="random") renderRandom();
  if(v==="favorites") renderFavorites();
  if(v==="manage") renderManage();
}

function normalPool(){
  if(selectedCategories.size===0) return questions;
  return questions.filter(q=>selectedCategories.has(q.categoryId));
}

function activePool(){
  if(questionMode==="favorites") return questions.filter(q=>favorites.has(q.id));
  return normalPool();
}

function pickNext(){
  const pool=activePool();
  if(!pool.length){
    toast(questionMode==="favorites" ? "즐겨찾기 질문이 없습니다." : "선택한 카테고리에 질문이 없습니다.");
    return;
  }
  let candidates=pool;
  if(pool.length>1 && currentQuestionId){
    const withoutCurrent=pool.filter(q=>q.id!==currentQuestionId);
    if(withoutCurrent.length) candidates=withoutCurrent;
  }
  const q=randomFrom(candidates);
  currentQuestionId=q.id;
  renderRandom();
}

function toggleCategory(catId){
  questionMode="normal";
  if(catId==="all"){
    selectedCategories.clear();
  }else{
    if(selectedCategories.has(catId)) selectedCategories.delete(catId);
    else selectedCategories.add(catId);
  }
  currentQuestionId=null;
  pickNext();
}
function renderRandom(){
  let pool=activePool();
  let chosen=currentQuestionId ? questions.find(x=>x.id===currentQuestionId && pool.some(p=>p.id===x.id)) : null;
  if(!chosen) chosen=randomFrom(pool);

  if(!chosen){
    document.getElementById("q-view").innerHTML=`<div class="empty">${questionMode==="favorites" ? "즐겨찾기 질문이 없습니다." : "질문이 없습니다. 질문 관리에서 추가해 주세요."}</div>`;
    return;
  }

  currentQuestionId=chosen.id;
  const isFav=favorites.has(chosen.id);
  const rangeText = questionMode==="favorites"
    ? `즐겨찾기 · ${pool.length}개 질문`
    : selectedCategories.size===0
      ? `전체 질문 · ${questions.length}개`
      : `${[...selectedCategories].map(catName).join(" + ")} · ${pool.length}개 질문`;

  document.getElementById("q-view").innerHTML=`
    <div class="question-card">
      <div class="card-inner">
        <div class="question-area">
          <span class="category-pill">${escapeHtml(catName(chosen.categoryId))}</span>
          <div class="question">${escapeHtml(chosen.text)}</div>
        </div>
        <div class="card-actions">
          <button class="heart ${isFav?"fav":""}" id="heartBtn" aria-label="즐겨찾기">${isFav?"♥":"♡"}</button>
          <button class="primary" id="randomBtn">🎲 다른 질문</button>
        </div>
      </div>
    </div>
    ${questionMode==="normal" ? `
      <div class="toolbar">
        <button class="chip ${selectedCategories.size===0?"active":""}" data-cat="all">전체 질문</button>
        ${categories.map(c=>`<button class="chip ${selectedCategories.has(c.id)?"active":""}" data-cat="${escapeHtml(c.id)}">${escapeHtml(c.name)}</button>`).join("")}
      </div>
      <div class="range-info">선택 범위 · ${escapeHtml(rangeText)}</div>
    ` : `
      <div class="toolbar">
        <button class="secondary" id="backToNormal">← 전체 질문으로</button>
      </div>
      <div class="range-info">선택 범위 · ${escapeHtml(rangeText)}</div>
    `}
  `;

  document.getElementById("randomBtn").onclick=pickNext;
  document.getElementById("heartBtn").onclick=()=>toggleFavorite(chosen.id);
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>toggleCategory(b.dataset.cat));
  const back=document.getElementById("backToNormal");
  if(back) back.onclick=()=>{questionMode="normal";currentQuestionId=null;pickNext();};
}

function toggleFavorite(id){
  if(favorites.has(id)){favorites.delete(id);toast("즐겨찾기에서 뺐어요.");}
  else{favorites.add(id);toast("즐겨찾기에 저장했어요.");}
  q_save();updateNav();
  if(currentView==="favorites") renderFavorites();
  else {
    if(questionMode==="favorites" && !favorites.has(currentQuestionId)) currentQuestionId=null;
    renderRandom();
  }
}
function renderCategories(){
  document.getElementById("q-view").innerHTML=`
    <div class="category-grid">
      ${categories.map(c=>{
        const count=questions.filter(q=>q.categoryId===c.id).length;
        return `<button class="cat-card" data-cat="${escapeHtml(c.id)}"><strong>${escapeHtml(c.name)}</strong><span>${count}개의 질문</span></button>`;
      }).join("")}
    </div>
  `;
  document.querySelectorAll(".cat-card").forEach(b=>b.onclick=()=>categoryRandom(b.dataset.cat));
}
function renderFavorites(){
  const list=questions.filter(q=>favorites.has(q.id));
  document.getElementById("q-view").innerHTML=`
    <div class="toolbar">
      <button class="primary" id="favRoulette">♥ 즐겨찾기에서 질문 뽑기</button>
      ${list.length?`<button class="danger" id="clearFavorites">즐겨찾기 전체 삭제</button>`:""}
    </div>
    <div class="list">
      ${list.length?list.map(q=>`<div class="item">
        <div class="item-main"><div class="item-cat">${escapeHtml(catName(q.categoryId))}</div><div class="item-text">${escapeHtml(q.text)}</div></div>
        <div class="item-actions"><button class="icon-btn" data-remove="${q.id}">♥</button></div>
      </div>`).join(""):`<div class="panel empty">아직 저장한 질문이 없습니다.<br>질문 카드의 ♡를 눌러 저장해보세요.</div>`}
    </div>
  `;

  document.getElementById("favRoulette").onclick=()=>{
    if(!list.length){toast("즐겨찾기 질문이 없습니다.");return}
    questionMode="favorites";
    currentQuestionId=null;
    currentView="random";
    updateNav();
    pickNext();
  };

  const clear=document.getElementById("clearFavorites");
  if(clear) clear.onclick=()=>{
    if(!confirm(`즐겨찾기 ${favorites.size}개를 모두 삭제할까요?`)) return;
    favorites.clear();
    if(questionMode==="favorites"){
      questionMode="normal";
      currentQuestionId=null;
    }
    q_save();updateNav();toast("즐겨찾기를 모두 삭제했어요.");renderFavorites();
  };

  document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>toggleFavorite(b.dataset.remove));
}

function renderManage(){
  document.getElementById("q-view").innerHTML=`
    <div class="panel">
      <div class="panel-title">새 질문 추가</div>
      <div class="form-grid">
        <div><label>카테고리</label><select id="qCat">${categories.map(c=>`<option value="${escapeHtml(c.id)}">${escapeHtml(c.name)}</option>`).join("")}</select></div>
        <div><label>질문</label><textarea id="qText" placeholder="생각할 거리를 입력하세요."></textarea></div>
        <button class="primary" id="addQ">+ 질문 추가</button>
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-title">카테고리 관리</div>
      <div class="form-row"><input id="newCat" placeholder="새 카테고리 이름 (예: 🎭 장르)"><button class="primary" id="addCat">+ 추가</button></div>
      <div class="list" style="margin-top:12px">
        ${categories.map(c=>`<div class="item"><div class="item-main"><div class="item-text">${escapeHtml(c.name)} <span class="small">· ${questions.filter(q=>q.categoryId===c.id).length}개</span></div></div><div class="item-actions"><button class="icon-btn" data-rename="${escapeHtml(c.id)}">수정</button>${categories.length>1?`<button class="icon-btn" data-delcat="${escapeHtml(c.id)}">삭제</button>`:""}</div></div>`).join("")}
      </div>
    </div>
    <div class="panel" style="margin-top:16px">
      <div class="panel-title">질문 목록 <span class="small">(${questions.length}개)</span></div>
      <div class="list">
        ${questions.map(q=>`<div class="item">
          <div class="item-main"><div class="item-cat">${escapeHtml(catName(q.categoryId))}</div><div class="item-text">${escapeHtml(q.text)}</div></div>
          <div class="item-actions"><button class="icon-btn" data-edit="${q.id}">수정</button><button class="icon-btn" data-del="${q.id}">삭제</button></div>
        </div>`).join("")}
      </div>
    </div>
  `;
  document.getElementById("addQ").onclick=()=>{
    const text=document.getElementById("qText").value.trim(), categoryId=document.getElementById("qCat").value;
    if(!text){toast("질문을 입력해 주세요.");return}
    const id="q"+Date.now().toString(36);
    questions.push({id,categoryId,text});q_save();toast("질문을 추가했어요.");renderManage();
  };
  document.getElementById("addCat").onclick=()=>{
    const name=document.getElementById("newCat").value.trim();
    if(!name){toast("카테고리 이름을 입력해 주세요.");return}
    const id="c"+Date.now().toString(36);
    categories.push({id,name});q_save();toast("카테고리를 추가했어요.");renderManage();
  };
  document.querySelectorAll("[data-rename]").forEach(b=>b.onclick=()=>{
    const c=categories.find(x=>x.id===b.dataset.rename);if(!c)return;
    const name=prompt("새 카테고리 이름",c.name);
    if(name&&name.trim()){c.name=name.trim();q_save();renderManage();}
  });
  document.querySelectorAll("[data-delcat]").forEach(b=>b.onclick=()=>{
    const c=categories.find(x=>x.id===b.dataset.delcat);if(!c)return;
    const count=questions.filter(q=>q.categoryId===c.id).length;
    if(!confirm(`"${c.name}" 카테고리를 삭제할까요?\n이 카테고리의 질문 ${count}개도 함께 삭제됩니다.`))return;
    const ids=new Set(questions.filter(q=>q.categoryId===c.id).map(q=>q.id));
    questions=questions.filter(q=>q.categoryId!==c.id);
    ids.forEach(id=>favorites.delete(id));
    categories=categories.filter(x=>x.id!==c.id);q_save();renderManage();
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    const q=questions.find(x=>x.id===b.dataset.del);if(!q)return;
    if(confirm("이 질문을 삭제할까요?")){
      questions=questions.filter(x=>x.id!==q.id);favorites.delete(q.id);q_save();renderManage();
    }
  });
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>{
    const q=questions.find(x=>x.id===b.dataset.edit);if(!q)return;
    const next=prompt("질문 수정",q.text);
    if(next!==null && next.trim()){q.text=next.trim();q_save();renderManage();}
  });
}
function q_exportBackup(){
  const data={
    app:"Q&A",
    version:1,
    exportedAt:new Date().toISOString(),
    categories,
    questions,
    favorites:[...favorites]
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json;charset=utf-8"});
  const url=URL.createObjectURL(blob),a=document.createElement("a");
  const d=new Date(), stamp=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  a.href=url;a.download=`QA_${stamp}.json`;a.click();URL.revokeObjectURL(url);
  toast("백업 파일을 만들었어요.");
}

function importBackup(e){
  const file=e.target.files?.[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      if(!Array.isArray(data.categories)||!Array.isArray(data.questions)||!Array.isArray(data.favorites)) throw new Error();
      if(!confirm("현재 질문·카테고리·즐겨찾기를 백업 파일 내용으로 교체할까요?"))return;
      categories=data.categories;questions=data.questions;favorites=new Set(data.favorites);currentQuestionId=null;questionMode="normal";selectedCategories.clear();
      q_save();toast("백업을 가져왔어요.");setView("manage");
    }catch(err){alert("올바른 Q&A 백업 JSON 파일이 아닙니다.");}
    e.target.value="";
  };
  reader.readAsText(file,"utf-8");
}

document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>setView(b.dataset.view));
document.querySelectorAll("[data-mobile-view]").forEach(b=>b.onclick=()=>setView(b.dataset.mobileView));
setView("random");
</script>
<script>(function(){
"use strict";
const KEY="select_picker_v5";
const s_$=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

let db;
try{db=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){db=null}
if(!db || !Array.isArray(db.sets) || !db.sets.length){
  const first={id:uid(),name:"A세트",items:["카페 가기","도서관 가기","운동장 가기"],removed:[]};
  db={sets:[first],active:first.id,mode:"random"};
}
if(!db.sets.some(s=>s.id===db.active)) db.active=db.sets[0].id;
if(!db.mode) db.mode="random";

let mode=db.mode;
let busy=false;

function s_save(){
  db.mode=mode;
  try{localStorage.setItem(KEY,JSON.stringify(db))}
  catch(e){alert("브라우저 저장 기능을 사용할 수 없습니다.")}
}
function active(){return db.sets.find(s=>s.id===db.active)||db.sets[0]}

window.randomSelectBridge={
  exportData(){
    return structuredClone({sets:db.sets,active:db.active,mode:mode});
  },
  importData(x){
    if(!x||!Array.isArray(x.sets)||!x.sets.length) throw new Error("invalid SELECT data");
    const cleanSets=x.sets.map(set=>({
      id:String(set.id||uid()),
      name:String(set.name||"이름 없는 세트"),
      items:Array.isArray(set.items)?set.items.map(v=>String(v)):[],
      removed:Array.isArray(set.removed)?set.removed.filter(Number.isInteger):[]
    }));
    db.sets=cleanSets;
    db.active=cleanSets.some(set=>set.id===x.active)?x.active:cleanSets[0].id;
    mode=x.mode==="remove"?"remove":"random";
    s_save();resetResult();s_render();
  },
  resetData(){
    const first={id:uid(),name:"A세트",items:["카페 가기","도서관 가기","운동장 가기"],removed:[]};
    db={sets:[first],active:first.id,mode:"random"};
    mode="random";s_save();resetResult();s_render();
  }
};

function getRemovedSet(){
  const s=active();
  if(!s.removed) s.removed=[];
  return new Set(s.removed);
}

function setRemovedSet(remSet){
  const s=active();
  s.removed=Array.from(remSet);
  s_save();
}

function resetResult(){
  if(mode!=="remove"){
    setRemovedSet(new Set());
  }
  s_$("s-resultLabel").textContent="오늘의 결정";
  s_$("s-resultText").textContent="결정이 필요하신가요?";
  s_$("s-resultSub").textContent="고민은 여기까지.";
  s_$("s-status").textContent="";
}

function s_render(){
  const s=active();
  const rem=getRemovedSet();

  s_$("s-modeHelp").textContent=(s.name+" · "+s.items.length+"개 · ")+(mode==="remove"?"뽑힌 항목을 하나씩 제외해 마지막 1개까지 좁힙니다.":"전체 항목에서 매번 무작위로 하나를 고릅니다.");

  const alive=s.items.map((_,i)=>i).filter(i=>!rem.has(i));
  s_$("s-itemCount").textContent=(mode==="remove"?"남은 "+alive.length+"개 · ":"")+"전체 "+s.items.length+"개";

  s_$("s-items").innerHTML=s.items.length
    ? s.items.map((x,i)=>'<div class="item '+(rem.has(i)?"removed":"")+'"><span class="name">'+esc(x)+'</span><span class="state">'+(rem.has(i)?"제거됨":"")+"</span></div>").join("")
    : '<div class="empty" style="grid-column:1/-1">이 세트에는 항목이 없습니다.</div>';

  s_$("s-resetRemoved").style.display=(mode==="remove" && rem.size)?"block":"none";
  s_$("s-pickBtn").textContent="선택하기";
  s_$("s-modeRandom").classList.toggle("active",mode==="random");
  s_$("s-modeRemove").classList.toggle("active",mode==="remove");
}

function setMode(m){
  if(busy)return;
  mode=m;
  if(mode!=="remove"){
    setRemovedSet(new Set());
  }
  resetResult();
  s_save();
  s_render();
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function pick(){
  if(busy)return;
  const s=active();
  const rem=getRemovedSet();
  const pool=s.items.map((_,i)=>i).filter(i=>mode==="random" || !rem.has(i));

  if(!pool.length){
    s_$("s-status").textContent="선택할 항목이 없습니다.";
    return;
  }

  busy=true;
  s_$("s-pickBtn").disabled=true;

  for(const n of [3,2,1]){
    s_$("s-resultLabel").textContent="선택 중";
    s_$("s-resultText").textContent=n;
    s_$("s-resultSub").textContent="";
    await sleep(700);
  }

  const index=pool[Math.floor(Math.random()*pool.length)];
  s_$("s-resultLabel").textContent="결정 완료";
  s_$("s-resultText").textContent=s.items[index];

  if(mode==="remove"){
    rem.add(index);
    setRemovedSet(rem);
    s_$("s-resultSub").textContent="이 선택지는 제외했습니다. 계속 좁혀볼까요?";
  }else{
    s_$("s-resultSub").textContent="결정 완료. 고민 끝.";
  }

  s_render();
  if(mode==="remove" && s.items.length-rem.size===1)
    s_$("s-status").textContent="이제 마지막 1개가 남았습니다.";

  busy=false;
  s_$("s-pickBtn").disabled=false;
}

function s_closeModal(){s_$("s-modalBack").classList.remove("show")}
function openModal(title,body){
  s_$("s-modalTitle").textContent=title;
  s_$("s-modalBody").innerHTML=body;
  s_$("s-modalBack").classList.add("show");
}

function newSet(){
  openModal("새 세트 만들기",
    '<div class="manage-row">'+
    '<input id="createName" class="input" placeholder="예: 주말 선택지">'+
    '<button class="btn primary" id="createNow">만들기</button>'+
    '</div>');
  const input=s_$("createName");
  const create=()=>{
    const name=input.value.trim();
    if(!name){input.focus();return}
    const s={id:uid(),name,items:[],removed:[]};
    db.sets.push(s);
    db.active=s.id;
    s_save();
    mode="random";
    s_render();
    s_closeModal();
    openItems(s.id);
  };
  s_$("createNow").onclick=create;
  input.onkeydown=e=>{if(e.key==="Enter")create()};
  setTimeout(()=>input.focus(),30);
}

function openSets(){
  openModal("세트 관리",
    '<div class="manage-row">'+
    '<input id="newSetName" class="input" placeholder="새 세트 이름">'+
    '<button class="btn primary" id="createSet">추가</button>'+
    '</div>'+
    '<div id="setList"></div>');
  renderSetList();

  const input=s_$("newSetName");
  const add=()=>{
    const name=input.value.trim();
    if(!name){input.focus();return}
    const s={id:uid(),name,items:[],removed:[]};
    db.sets.push(s);
    db.active=s.id;
    s_save();
    mode="random";
    s_render();
    s_closeModal();
    openItems(s.id);
  };
  s_$("createSet").onclick=add;
  input.onkeydown=e=>{if(e.key==="Enter")add()};
}

function renderSetList(){
  const list=s_$("setList");
  if(!list)return;
  list.innerHTML=db.sets.map(s=>
    '<div class="set-card '+(s.id===db.active?"active":"")+'" data-set-id="'+esc(s.id)+'" tabindex="0" role="button" aria-label="'+esc(s.name)+' 세트 선택">'+
      '<div><div class="set-name">'+esc(s.name)+'</div><div class="set-count">'+s.items.length+"개 항목"+(s.id===db.active?" · 선택됨":"")+"</div></div>"+
      '<div class="set-actions">'+
        '<button class="small icon-only" data-action="rename" data-id="'+esc(s.id)+'" aria-label="제목 수정" title="제목 수정">✎</button>'+
        '<button class="small icon-only delete-set" data-action="delete" data-id="'+esc(s.id)+'" aria-label="세트 삭제" title="세트 삭제">×</button>'+
      '</div>'+
    '</div>'
  ).join("");
}

function openItems(id){
  const s=db.sets.find(x=>x.id===id);
  if(!s)return;

  openModal("항목 편집",
    '<div class="manage-row">'+
      '<input id="newItem" class="input" placeholder="새 선택 항목">'+
      '<button class="btn primary" id="addItem">추가</button>'+
    '</div>'+
    '<div id="editList"></div>'
  );
  renderEditList(id);

  const input=s_$("newItem");
  const add=()=>{
    const value=input.value.trim();
    if(!value){input.focus();return}
    s.items.push(value);
    s.removed=[];
    s_save();
    input.value="";
    s_render();
    renderEditList(id);
    input.focus();
  };
  s_$("addItem").onclick=add;
  input.onkeydown=e=>{if(e.key==="Enter")add()};
}

function renderEditList(id){
  const s=db.sets.find(x=>x.id===id);
  const list=s_$("editList");
  if(!s||!list)return;

  list.innerHTML=s.items.length
    ? s.items.map((x,i)=>
      '<div class="edit-item">'+
        '<input class="input edit-name" data-i="'+i+'" value="'+esc(x)+'">'+
        '<button class="small" data-del-item="'+i+'">×</button>'+
      '</div>'
    ).join("")
    : '<div class="empty">아직 항목이 없습니다.</div>';

  list.querySelectorAll(".edit-name").forEach(input=>{
    input.onchange=()=>{
      const i=Number(input.dataset.i);
      const value=input.value.trim();
      if(value)s.items[i]=value;
      s_save();s_render();
    };
  });

  list.querySelectorAll("[data-del-item]").forEach(btn=>{
    btn.onclick=()=>{
      s.items.splice(Number(btn.dataset.delItem),1);
      s.removed=[];
      s_save();s_render();renderEditList(id);
    };
  });
}

function s_exportBackup(){
  const payload={
    app:"Select",
    version:1,
    exportedAt:new Date().toISOString(),
    presets:{sets:db.sets,active:db.active,mode:mode}
  };
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  const stamp=new Date().toISOString().slice(0,10).replaceAll("-","");
  a.href=url;a.download="Select_presets_"+stamp+".json";
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  s_$("s-status").textContent="프리셋 백업 파일을 만들었습니다.";
}

function importBackupFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    let data;
    try{
      data=JSON.parse(String(reader.result??"").replace(/^\uFEFF/,"").trim());
    }catch(e){
      alert("SELECT JSON 파일을 읽을 수 없습니다.");
      s_$("s-importFile").value="";
      return;
    }
    try{
      const p=(data&&data.presets&&typeof data.presets==="object")?data.presets:data;
      if(!p||!Array.isArray(p.sets)||!p.sets.length)throw new Error("invalid");
      const cleanSets=p.sets.map(set=>({
        id:String(set.id||uid()),
        name:String(set.name||"이름 없는 세트"),
        items:Array.isArray(set.items)?set.items.map(x=>String(x)):[],
        removed:Array.isArray(set.removed)?set.removed.filter(Number.isInteger):[]
      }));
      if(!confirm("현재 프리셋을 백업 파일의 내용으로 교체할까요?")){
        s_$("s-importFile").value=""; return;
      }
      db.sets=cleanSets;
      db.active=cleanSets.some(set=>set.id===p.active)?p.active:cleanSets[0].id;
      mode=p.mode==="remove"?"remove":"random";
      s_save();resetResult();s_render();
      s_$("s-status").textContent="프리셋을 가져왔습니다.";
    }catch(e){
      console.error("SELECT import error",e);
      alert("SELECT 프리셋 데이터 형식을 확인할 수 없습니다.");
    }
    s_$("s-importFile").value="";
  };
  reader.onerror=()=>alert("SELECT 파일을 읽는 중 오류가 발생했습니다.");
  reader.readAsText(file,"utf-8");
}

s_$("s-modeRandom").onclick=()=>setMode("random");
s_$("s-modeRemove").onclick=()=>setMode("remove");
s_$("s-pickBtn").onclick=pick;

s_$("s-resetRemoved").onclick=()=>{
  setRemovedSet(new Set());
  resetResult();
  s_render();
  s_$("s-status").textContent="제거된 항목을 모두 되돌렸습니다.";
};

s_$("s-manageSets").onclick=openSets;
s_$("s-editItems").onclick=()=>openItems(active().id);
s_$("s-closeModal").onclick=s_closeModal;
s_$("s-modalBack").onclick=e=>{if(e.target===s_$("s-modalBack"))s_closeModal()};

s_$("s-modalBody").addEventListener("click",e=>{
  const setCard=e.target.closest(".set-card[data-set-id]");
  const btn=e.target.closest("button[data-action]");
  if(setCard && !btn){
    db.active=setCard.dataset.setId;
    resetResult();s_save();s_render();renderSetList();
    return;
  }
  if(!btn)return;

  const id=btn.dataset.id;
  const s=db.sets.find(x=>x.id===id);
  if(!s)return;

  if(btn.dataset.action==="rename"){
    const name=prompt("세트 이름을 수정하세요.",s.name);
    if(name!==null && name.trim()){
      s.name=name.trim();
      s_save();s_render();renderSetList();
    }
  }

  if(btn.dataset.action==="delete"){
    if(db.sets.length<=1){
      alert("세트가 하나뿐이라 삭제할 수 없습니다.");
      return;
    }
    if(confirm('"'+s.name+'" 세트를 삭제할까요?')){
      db.sets=db.sets.filter(x=>x.id!==id);
      if(db.active===id)db.active=db.sets[0].id;
      s_save();s_render();renderSetList();
    }
  }
});

s_render();
})();</script>

const majorSymbol={M00:"절벽 끝의 여행자, 흰 장미, 작은 개, 높은 산은 순수한 가능성과 위험을 함께 보여준다.",M01:"한 손은 하늘, 한 손은 땅을 가리키고 탁자에는 네 수트의 도구가 놓여 있다. 생각을 현실로 옮길 자원이 이미 있다는 그림이다.",M02:"흑백 기둥 사이의 여사제와 장막, 달은 겉으로 드러나지 않은 지식과 직관을 뜻한다.",M03:"곡식과 숲, 금성 문양, 풍성한 옷은 생명력·감각·돌봄·창조가 자라는 장면이다.",M04:"돌 왕좌와 산, 갑옷은 감정보다 구조와 경계, 책임을 먼저 세우는 힘을 보여준다.",M05:"두 제자와 열쇠, 의식적 손짓은 전통·교육·제도 안에서 지식을 전수하는 장면이다.",M06:"두 인물과 천사, 나무와 산은 끌림만이 아니라 서로 다른 가치 앞에서의 선택과 결합을 보여준다.",M07:"전차와 서로 다른 두 스핑크스는 반대 방향의 힘을 의지로 한 방향에 묶어 전진시키는 모습이다.",M08:"여인이 사자를 억누르지 않고 부드럽게 다루는 장면은 힘을 폭력이 아니라 인내와 자기조절로 읽게 한다.",M09:"산꼭대기의 은둔자와 등불은 외부의 소음에서 떨어져 자기 기준과 지혜를 찾는 모습이다.",M10:"회전하는 바퀴와 여러 상징은 통제할 수 없는 순환, 변화하는 위치와 타이밍을 보여준다.",M11:"검과 저울은 감정적 편들기보다 사실·균형·책임에 따라 결론을 내리는 원리를 상징한다.",M12:"거꾸로 매달렸지만 표정이 평온한 인물과 빛나는 머리는 멈춤을 통해 관점이 바뀌는 순간을 보여준다.",M13:"해골 기수와 쓰러진 인물, 떠오르는 태양은 한 단계의 끝이 다음 단계의 시작을 만든다는 장면이다.",M14:"천사가 두 컵 사이로 물을 옮기며 한 발은 물, 한 발은 땅에 둔다. 서로 다른 것을 조절해 새 균형을 만드는 카드다.",M15:"사슬에 묶인 두 인물과 악마는 욕망·습관·집착에 스스로 묶인 상태와 그 사슬을 인식하는 문제를 보여준다.",M16:"번개 맞은 탑에서 사람들이 떨어지는 장면은 잘못 세운 구조가 갑자기 무너져 진실이 드러나는 순간이다.",M17:"별빛 아래 물을 붓는 인물은 큰 충격 뒤에 다시 흐르기 시작하는 희망·회복·솔직함을 보여준다.",M18:"달, 두 탑, 개와 늑대, 물에서 올라오는 가재는 익숙함과 본능 사이의 불확실한 길과 무의식을 상징한다.",M19:"큰 태양과 아이, 해바라기는 숨김없는 명료함·생명력·기쁨이 밖으로 드러나는 장면이다.",M20:"천사의 나팔에 사람들이 관에서 일어나는 장면은 과거를 돌아보고 부름에 응답해 새 단계로 깨어나는 순간이다.",M21:"월계환 속 인물과 네 존재는 긴 여정의 요소들이 하나로 통합되어 한 주기가 완성되는 모습을 보여준다."};
const suitSymbol={Wands:"완드는 불의 수트다. 그림에서 막대기·움직임·몸의 방향을 보고 열정, 행동, 창조력의 상태를 읽는다.",Cups:"컵은 물의 수트다. 컵의 배치와 인물의 표정을 보고 감정, 관계, 수용과 교류의 상태를 읽는다.",Swords:"소드는 공기의 수트다. 검의 방향, 하늘과 인물의 긴장을 보고 생각, 말, 판단, 갈등의 상태를 읽는다.",Pentacles:"펜타클은 땅의 수트다. 동전, 작업, 건물과 몸의 자세를 보고 돈, 일, 건강, 생활 기반을 읽는다."};
const rankLesson={1:"에이스는 수트의 에너지가 씨앗처럼 막 시작되는 단계다.",2:"2는 둘 사이의 균형·선택·대립을 본다.",3:"3은 시작된 힘이 관계나 결과로 확장되는 단계다.",4:"4는 구조·안정·고정이 생기는 단계다.",5:"5는 안정이 흔들리며 갈등·결핍·변화를 겪는 단계다.",6:"6은 5의 흔들림 뒤 조정·회복·진전이 나타나는 단계다.",7:"7은 시험, 평가, 전략처럼 한 번 더 점검하는 단계다.",8:"8은 힘이 구체적으로 움직이거나 반복·숙련되는 단계다.",9:"9는 완성 직전의 성숙과 부담을 함께 본다.",10:"10은 한 사이클이 꽉 차 결과·완성과 다음 단계의 부담을 보여준다.",11:"시종은 배우고 관찰하며 소식을 가져오는 초보자의 에너지다.",12:"기사는 수트의 힘을 행동으로 밀어붙이는 방식이다.",13:"여왕은 수트의 힘을 내면에서 성숙하게 다루는 방식이다.",14:"왕은 수트의 힘을 외부 세계에서 책임 있게 운영하는 방식이다."};
const majorMeaning={M00:"익숙한 안전지대를 벗어나 새 경험을 시작한다. 아직 모든 답이 없어도 가능성을 믿고 첫발을 내딛는 힘이다.",M01:"아이디어를 실행할 도구와 능력이 손에 있다. 의도를 분명히 하고 가진 자원을 연결해 현실적인 행동으로 옮긴다.",M02:"겉으로 보이는 정보보다 직감과 아직 말해지지 않은 부분을 읽는다. 성급히 결론내리기보다 관찰하고 기다린다.",M03:"무언가를 키우고 돌보며 풍요롭게 만드는 힘이다. 창작, 관계, 몸과 생활을 실제로 보살피는 쪽으로 읽는다.",M04:"경계와 규칙을 세우고 책임 있게 통제한다. 감정보다 구조를 먼저 잡아 안정적인 기반을 만드는 카드다.",M05:"검증된 방식, 스승, 조직, 전통에서 배운다. 혼자만의 방식보다 공통의 규칙과 지식을 참고할 때다.",M06:"중요한 관계 또는 가치의 선택이다. 무엇을 좋아하느냐보다 어떤 가치와 약속을 선택할 것인지가 핵심이다.",M07:"서로 다른 욕구를 한 방향으로 묶어 밀고 나간다. 목표가 분명할수록 추진력이 강해진다.",M08:"강한 감정이나 본능을 억압하지 않고 부드럽게 다룬다. 인내, 용기, 자기조절이 실제 힘이 된다.",M09:"밖의 답보다 안의 기준을 찾는 시간이다. 혼자 생각하고 조사하며 불필요한 소음을 줄일수록 답이 선명해진다.",M10:"상황의 국면이 바뀐다. 모든 것을 통제하기보다 돌아오는 기회와 타이밍을 읽고 변화에 맞춰 움직인다.",M11:"행동의 결과를 객관적으로 마주한다. 사실, 계약, 기준, 책임을 따져 공정한 결론을 내리는 카드다.",M12:"억지로 진행하기보다 멈추고 보는 방향을 바꾼다. 내려놓음이나 기다림이 손해가 아니라 새로운 이해를 만든다.",M13:"끝내야 할 것을 끝내야 다음 단계가 열린다. 실제 죽음보다 관계·상태·습관·국면의 강한 종료와 변화를 뜻한다.",M14:"극단으로 가지 않고 서로 다른 요소를 섞어 적정점을 찾는다. 천천히 조절하고 회복하며 지속 가능한 균형을 만든다.",M15:"욕망, 집착, 의존, 두려움이 선택을 묶고 있는지 본다. 사슬을 알아차리는 순간 선택권도 다시 보이기 시작한다.",M16:"버티던 구조가 갑자기 깨지며 숨겨진 문제가 드러난다. 충격은 크지만 거짓 기반을 걷어내고 다시 세울 기회이기도 하다.",M17:"상처 뒤에 희망과 신뢰가 돌아온다. 과장된 낙관보다 솔직함, 회복, 장기적인 방향을 믿는 카드다.",M18:"정보가 흐리고 감정과 상상이 사실처럼 느껴질 수 있다. 직감을 무시하지 않되 확인되지 않은 공포를 사실로 단정하지 않는다.",M19:"상황이 밝아지고 에너지와 자신감이 드러난다. 숨길 것이 적고 결과를 즐기며 솔직하게 표현하기 좋은 카드다.",M20:"과거의 경험을 다시 평가하고 중요한 부름이나 결정을 받아들인다. 같은 패턴을 반복할지 새 단계로 갈지 선택하는 각성의 카드다.",M21:"긴 과정이 하나의 완성된 형태로 닫힌다. 성취를 인정하고 배운 것을 통합한 뒤 다음 사이클로 넘어간다."};
const reverseMajor={M00:"무모한 도약, 준비 부족, 혹은 반대로 두려워 시작하지 못하는 상태를 본다.",M01:"능력은 있지만 집중이 흩어지거나 기술을 잘못 쓰는 상태다. 말보다 실제 실행과 의도를 점검한다.",M02:"직감을 무시하거나 비밀과 혼란에 갇힐 수 있다. 느낌과 사실을 구분한다.",M03:"과보호, 창작 정체, 자기 돌봄 부족처럼 성장의 흐름이 막힌 상태를 본다.",M04:"통제가 지나쳐 경직되거나 반대로 구조가 무너진 상태다. 필요한 경계만 남긴다.",M05:"낡은 규칙에 얽매이거나 기존 방식에서 벗어나 자기 기준을 찾는 과정이다.",M06:"가치 불일치, 관계의 어긋남, 선택 회피를 본다. 원하는 것과 약속할 수 있는 것을 구분한다.",M07:"방향 상실, 과속, 통제력 저하를 본다. 속도보다 목표 정렬이 먼저다.",M08:"자기 의심, 감정 소진, 억눌린 분노처럼 내면의 힘이 흔들리는 상태다.",M09:"고립이 지나치거나 필요한 성찰을 피하는 상태다. 혼자 있음과 단절을 구분한다.",M10:"변화를 거부하거나 같은 패턴이 반복되는 느낌이다. 통제 가능한 부분과 아닌 부분을 나눈다.",M11:"불공정, 책임 회피, 자기합리화를 경계한다. 판단 전에 사실과 자신의 몫을 다시 확인한다.",M12:"의미 없는 희생, 지연, 놓지 못함을 본다. 기다림이 실제 통찰을 만드는지 확인한다.",M13:"끝난 것을 붙잡아 변화가 지연되는 상태다. 무엇을 놓아야 하는지가 핵심이다.",M14:"균형이 깨지고 과하거나 부족한 상태다. 속도를 낮추고 조합을 다시 맞춘다.",M15:"속박을 알아차리고 벗어나는 과정이거나, 집착을 부정해 더 깊이 묶인 상태일 수 있다.",M16:"붕괴를 피하려 문제를 미루거나, 충격 이후 재건을 시작하는 단계다.",M17:"희망 저하, 회복에 대한 불신을 본다. 작은 회복의 증거부터 확인한다.",M18:"혼란이 걷히기 시작하거나 반대로 불안과 자기기만이 깊어진다. 확인 가능한 정보가 중요하다.",M19:"기쁨이 줄거나 성과를 충분히 누리지 못하는 상태다. 지나친 낙관도 점검한다.",M20:"자기비판, 과거에 대한 미련, 중요한 결정을 미루는 상태다. 이미 배운 교훈을 인정한다.",M21:"마무리가 덜 되었거나 완성 직전의 지연이다. 빠진 조각을 확인하고 끝맺는다."};
function rank(c){return c.family==="Major"?0:Number(c.id.slice(1))}
function imageCode(c){if(c.family==="Major")return "ar"+c.id.slice(1);const pre={Wands:"wa",Cups:"cu",Swords:"sw",Pentacles:"pe"}[c.family],r=rank(c);return pre+(r===1?"ac":r<=10?String(r).padStart(2,"0"):r===11?"pa":r===12?"kn":r===13?"qu":"ki")}
function imageUrl(c){return "https://raw.githubusercontent.com/seven102161/elaine-tarot-cards/main/cards/"+imageCode(c)+".jpg"}
function core(c){if(c.family==="Major")return majorMeaning[c.id];const k=c.keywords.split(",").map(x=>x.trim());return `${c.ko}는 ${suitSymbol[c.family]} ${rankLesson[rank(c)]} 이 카드에서는 특히 ‘${k.slice(0,3).join(" · ")}’의 흐름을 본다.`}
function symbol(c){if(c.family==="Major")return majorSymbol[c.id];return `${suitSymbol[c.family]} ${rankLesson[rank(c)]} 카드 그림에서 인물의 시선·몸의 방향, ${c.family==="Wands"?"완드가 향하는 방향과 움직임":c.family==="Cups"?"컵이 채워져 있는지와 인물 사이의 거리":c.family==="Swords"?"검의 방향과 하늘의 분위기":"펜타클의 배치와 일·집·몸의 상태"}를 먼저 관찰하면 의미를 외우기 쉽다.`}
function upright(c){if(c.family==="Major")return majorMeaning[c.id];const k=c.keywords.split(",").map(x=>x.trim());return `정방향에서는 ${k.slice(0,3).join("·")}이 비교적 자연스럽게 밖으로 드러난다. ${rankLesson[rank(c)]} 질문 속 상황에서 이 에너지가 어디에서 실제로 작동하는지 찾는다.`}
function reversed(c){if(c.family==="Major")return reverseMajor[c.id];const k=c.keywords.split(",").map(x=>x.trim());return `역방향은 정방향의 반대말 하나로 외우기보다 ‘막힘·과잉·부족·내면화·지연’ 중 무엇인지 본다. 이 카드의 ${k[0]} 또는 ${k[1]||k[0]}이 지나치거나 제대로 표현되지 않는 지점을 확인한다.`}
function readingPoint(c,rev){const k=c.keywords.split(",").map(x=>x.trim());return rev?`먼저 “${k[0]}이 막히거나 과해진 부분은 어디인가?”를 묻는다. 카드가 나쁘다고 결론내리기보다 정방향의 힘을 건강하게 회복하려면 무엇을 조정할지 읽는다.`:`먼저 “지금 상황에서 ${k[0]}이 어디에 나타나는가?”를 묻고, 두 번째로 “그 흐름을 살리려면 어떤 행동이 필요한가?”를 본다. 카드 한 장은 사건 확정보다 현재의 초점으로 읽는다.`}
function memory(c){if(c.family==="Major"){const m={M00:"절벽 앞의 첫걸음 = 가능성",M01:"도구는 이미 탁자 위에 = 실행",M02:"장막 뒤의 지식 = 직관",M03:"풍성한 정원 = 키우는 힘",M04:"돌 왕좌 = 구조와 책임",M05:"스승과 제자 = 전통에서 배움",M06:"사랑보다 먼저 가치의 선택",M07:"두 힘을 한 방향으로 = 전진",M08:"사자를 부드럽게 다룸 = 진짜 힘",M09:"등불 하나로 길을 찾음 = 성찰",M10:"도는 바퀴 = 국면과 타이밍",M11:"저울과 검 = 균형 잡힌 판단",M12:"거꾸로 보면 다르게 보인다",M13:"끝이 있어야 다음이 시작된다",M14:"두 컵의 물을 섞음 = 조절",M15:"사슬을 알아차려야 벗어난다",M16:"번개 맞은 탑 = 거짓 구조의 붕괴",M17:"어둠 뒤 별빛 = 회복",M18:"달빛 길 = 불확실 속 직감",M19:"대낮의 태양 = 명료한 기쁨",M20:"나팔을 듣고 일어남 = 각성과 결단",M21:"월계환 = 한 주기의 완성"};return m[c.id]}return `${c.family==="Wands"?"불·행동":c.family==="Cups"?"물·감정":c.family==="Swords"?"공기·생각":"땅·현실"} + ${rankLesson[rank(c)].split("다.")[0]} = ${c.ko}`}
const $=id=>document.getElementById(id);let prefs={reversed:false};try{prefs.reversed=!!JSON.parse(localStorage.getItem(PREF_KEY)||"{}").reversed}catch(e){}
function syncReverseUI(){const cb=$("t-reversed"),btn=$("t-reverseToggle");if(!cb||!btn)return;cb.checked=!!prefs.reversed;btn.classList.toggle("active",!!prefs.reversed);btn.setAttribute("aria-pressed",prefs.reversed?"true":"false");btn.title=prefs.reversed?"역방향 포함 켜짐 · 다시 누르면 해제":"역방향 포함 꺼짐 · 누르면 활성화"}
function savePrefs(){const cb=$("t-reversed");if(cb)cb.checked=!!prefs.reversed;localStorage.setItem(PREF_KEY,JSON.stringify(prefs));syncReverseUI()}
syncReverseUI();$("t-reverseToggle").addEventListener("click",()=>{prefs.reversed=!prefs.reversed;savePrefs()});
function randomInt(max){if(!Number.isInteger(max)||max<=0)throw new RangeError("max must be a positive integer");if(window.crypto&&crypto.getRandomValues){const range=0x100000000,limit=range-(range%max),a=new Uint32Array(1);do{crypto.getRandomValues(a)}while(a[0]>=limit);return a[0]%max}return Math.floor(Math.random()*max)}
let session=[];
function showCard(c,rev){$("t-card").classList.remove("back");$("t-image").hidden=false;$("t-image").src=imageUrl(c);$("t-image").alt=c.ko+" 카드";$("t-image").classList.toggle("reversed",rev);$("t-cardContent").hidden=false;$("t-type").textContent=c.family==="Major"?"MAJOR ARCANA":c.family.toUpperCase();$("t-name").textContent=`${c.ko} · ${c.en}`;$("t-dir").textContent=rev?"역방향":"정방향";$("t-keywords").textContent=c.keywords;$("t-core").textContent=core(c);$("t-symbol").textContent=symbol(c);$("t-meaningLabel").textContent=rev?"역방향 해석":"정방향 해석";$("t-meaning").textContent=rev?reversed(c):upright(c);$("t-readingPoint").textContent=readingPoint(c,rev);$("t-memory").textContent=memory(c)}
function renderSession(){const box=$("t-session");if(!box)return;box.classList.toggle("show",session.length>1);box.innerHTML=session.length>1?session.map((x,i)=>`<div class="tarot-session-card"><img src="${imageUrl(x.card)}" class="${x.rev?"rev":""}" alt="${x.card.ko}"><span>${i+1}장 · ${x.card.ko}</span></div>`).join(""):""}
function pickFrom(pool){const c=pool[randomInt(pool.length)],rev=!!prefs.reversed&&randomInt(2)===1;return {card:c,rev}}
function draw(){session=[pickFrom(cards)];showCard(session[0].card,session[0].rev);renderSession()}
function drawNext(){const used=new Set(session.map(x=>x.card.id)),pool=cards.filter(c=>!used.has(c.id));if(!session.length)return draw();if(!pool.length)return;const x=pickFrom(pool);session.push(x);showCard(x.card,x.rev);renderSession()}
$("t-draw").onclick=draw;$("t-next").onclick=drawNext;
function guideCard(c){return `<article class="guide-card" data-family="${c.family}"><img loading="lazy" src="${imageUrl(c)}" alt="${c.ko}"><div><h5>${c.ko} · ${c.en}</h5><p><b>핵심</b> ${c.keywords}</p><p><b>정방향</b> ${upright(c)}</p><p><b>역방향</b> ${reversed(c)}</p><p><b>기억</b> ${memory(c)}</p></div></article>`}
function renderGuide(filter="All"){const list=filter==="All"?cards:cards.filter(c=>c.family===filter);$("t-guideCards").innerHTML=list.map(guideCard).join("");document.querySelectorAll("#t-module .guide-filter button").forEach(b=>b.classList.toggle("active",b.dataset.f===filter))}
function buildGuide(){if($("t-guideBody").dataset.ready)return;$("t-guideBody").dataset.ready="1";$("t-guideBody").innerHTML=`<div class="guide-intro"><div class="guide-section"><h4>카드를 읽는 순서</h4><ol><li>그림에서 가장 먼저 눈에 들어오는 인물·색·방향을 본다.</li><li>메이저인지, 마이너라면 수트와 숫자/궁정 계급을 확인한다.</li><li>키워드를 외우기보다 그림 → 수트 → 숫자 → 질문 순서로 의미를 좁힌다.</li><li>역방향은 단순한 반대가 아니라 막힘·과잉·부족·내면화·지연으로 본다.</li></ol></div><div class="guide-section"><h4>4개 수트</h4><p><b>완드 = 불</b> · 행동, 열정, 창조<br><b>컵 = 물</b> · 감정, 관계, 직관<br><b>소드 = 공기</b> · 생각, 말, 판단, 갈등<br><b>펜타클 = 땅</b> · 돈, 일, 몸, 생활</p></div><div class="guide-section"><h4>숫자와 궁정카드</h4><p>에이스 시작 · 2 균형/선택 · 3 확장 · 4 안정 · 5 흔들림 · 6 조정 · 7 시험 · 8 움직임/숙련 · 9 성숙 · 10 완성. 시종은 배우는 자, 기사는 행동하는 자, 여왕은 내면의 숙련, 왕은 외부의 운영으로 잡으면 외우기 쉽다.</p></div><div class="guide-section"><h4>1장과 3장 리딩</h4><p><b>1장</b>은 질문의 핵심 초점 하나를 깊게 읽는다. <b>3장</b>은 먼저 자리의 뜻을 정한다. 예: 과거-현재-미래 / 상황-장애물-조언 / 나-상대-관계. 각 장을 따로 해석한 뒤 ① 같은 수트가 반복되는지 ② 메이저가 어디에 있는지 ③ 숫자가 증가/감소하는지 ④ 인물의 시선과 카드의 분위기가 어디로 흐르는지 연결한다. 마지막에는 세 장을 한 문장으로 요약한다.</p></div></div><div class="guide-filter"><button data-f="All">전체 78</button><button data-f="Major">메이저</button><button data-f="Wands">완드</button><button data-f="Cups">컵</button><button data-f="Swords">소드</button><button data-f="Pentacles">펜타클</button></div><div class="guide-cards" id="t-guideCards"></div>`;document.querySelectorAll("#t-module .guide-filter button").forEach(b=>b.onclick=()=>renderGuide(b.dataset.f));renderGuide()}
function openGuide(){const back=$("t-guideBack");if(!back)return;try{buildGuide()}catch(err){console.error("Tarot guide error",err);$("t-guideBody").innerHTML=`<div class="guide-section"><h4>가이드북을 불러오지 못했습니다.</h4><p>페이지를 새로고침한 뒤 다시 눌러주세요.</p></div>`}back.classList.add("open");back.style.display="flex";back.setAttribute("aria-hidden","false");document.documentElement.style.overflow="hidden"}
function closeGuide(){const back=$("t-guideBack");if(!back)return;back.classList.remove("open");back.style.display="none";back.setAttribute("aria-hidden","true");document.documentElement.style.overflow=""}
window.openTarotGuide=openGuide;window.closeTarotGuide=closeGuide;const helpBtn=$("t-help"),closeBtn=$("t-guideClose"),guideBack=$("t-guideBack");if(helpBtn)helpBtn.onclick=openGuide;if(closeBtn)closeBtn.onclick=closeGuide;if(guideBack)guideBack.onclick=e=>{if(e.target===guideBack)closeGuide()};document.addEventListener("keydown",e=>{if(e.key==="Escape"&&guideBack&&guideBack.classList.contains("open"))closeGuide()});
window.randomTarotBridge={exportData:()=>({reversed:!!prefs.reversed}),importData:x=>{prefs.reversed=!!(x&&x.reversed);savePrefs()},resetData:()=>{prefs.reversed=false;savePrefs()}};
})();
</script>

</body></html>
